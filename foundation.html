  if(kind!=='blank'){
    var m=kind==='model',R=m?6.6:5.4,bd=[],pts=[];
    strokes.forEach(function(st){for(var j=0;j<st.length;j++){var A=st[j],B=st[j+1]||A,len=Math.hypot(B[0]-A[0],B[1]-A[1]),k=Math.max(1,Math.ceil(len/4));for(var u=0;u<=k;u++)pts.push([A[0]+ox+(B[0]-A[0])*u/k,A[1]+(B[1]-A[1])*u/k])}});
    strokes.forEach(function(st,i){
      var x=st[0][0]+ox,y=st[0][1],near=null;
      bd.forEach(function(q){if(!near&&Math.hypot(q.x-x,q.y-y)<R*2+2)near=q});
      if(!near){bd.push({x:x,y:y,t:String(i+1),r:R});return}
      /* later stroke starting beside (or on) an earlier start: badge goes next to the dot, in the emptiest direction */
      var best=null,bs=-1,rr=R*2+1.5;
      for(var a=0;a<360;a+=20){var rad=a*Math.PI/180,cx=x+Math.cos(rad)*rr,cy=y+Math.sin(rad)*rr;
        if(cx<ox+R||cx>ox+100-R||cy<R||cy>100-R)continue;
        var sc=1e9;pts.forEach(function(p){var d=Math.hypot(p[0]-cx,p[1]-cy);if(d<sc)sc=d});
        bd.forEach(function(q){var d=Math.hypot(q.x-cx,q.y-cy)-R;if(d<sc)sc=d});
        if(sc>bs){bs=sc;best=[cx,cy]}}
      if(best)bd.push({x:best[0],y:best[1],t:String(i+1),r:R,px:x,py:y});
      else{near.t+='·'+(i+1);near.r=R+3}});
    bd.forEach(function(q){if(q.px!==undefined)g+='<line x1="'+q.px+'" y1="'+q.py+'" x2="'+q.x+'" y2="'+q.y+'" stroke="#111" stroke-width="1.6"/>'});
    bd.forEach(function(q){
      if(m)g+='<circle cx="'+q.x+'" cy="'+q.y+'" r="'+q.r+'" fill="#111" stroke="#fff" stroke-width="1.4"/><text x="'+q.x+'" y="'+(q.y+3.2)+'" font-size="'+(q.t.length>1?8:9.5)+'" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif">'+q.t+'</text>';
      else g+='<circle cx="'+q.x+'" cy="'+q.y+'" r="'+q.r+'" fill="#fff" stroke="#111" stroke-width="1.8"/><text x="'+q.x+'" y="'+(q.y+2.8)+'" font-size="'+(q.t.length>1?6.2:7.5)+'" font-weight="800" fill="#111" text-anchor="middle" font-family="Arial,sans-serif">'+q.t+'</text>'})}
  return g}
var NC=6;
function traceRow(d,kase){
  var key=kase==='upper'?d.l:d.l.toLowerCase(),sk=(D.strokes&&D.strokes[kase]&&D.strokes[kase][key])||[],W=NC*100;
  var svg='<svg viewBox="0 0 '+W+' 100" role="img" aria-label="'+key+'" xmlns="http://www.w3.org/2000/svg">'+
   '<line x1="0" x2="'+W+'" y1="12" y2="12" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>'+
   '<line x1="0" x2="'+W+'" y1="38" y2="38" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>'+
   '<line x1="0" x2="'+W+'" y1="72" y2="72" stroke="#111" stroke-width="1.8"/>'+
   '<line x1="0" x2="'+W+'" y1="96" y2="96" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4"/>';
  var kinds=['model','dot','dot','dot','start','blank'];
  kinds.forEach(function(k,i){svg+=cell(sk,i*100,k)});
  svg+='<line x1="100" x2="100" y1="8" y2="100" stroke="#ddd" stroke-width="1"/></svg>';
  return '<div class="te-trow"><div class="te-lab">'+emoBox(d,'te-emo')+'<b>'+(kase==='upper'?d.l:d.l.toLowerCase())+'</b></div>'+svg+'</div>'}
function sheetTrace(){
  var ls=selSorted().map(function(l){return L[IDX[l]]}),rows=[];
  ls.forEach(function(d){if(T.kase==='both'){rows.push(traceRow(d,'upper'));rows.push(traceRow(d,'lower'))}else rows.push(traceRow(d,T.kase))});
  var per=T.kase==='both'?6:7;
  var seq=T.kase==='both'?ls.reduce(function(a,d){return a.concat([d,d])},[]):ls;
  var bodies=chunk(rows,per).map(function(r,pi){return '<div class="te-trows">'+r.join('')+'</div>'+noPicNote(chunk(seq,per)[pi]||[])});
  return pages('ورقة تتبّع الحروف','ابدأ من النقطة المرقّمة 1 ثم 2، وتتبّع النقاط، ثم اكتب بنفسك في الخانات الفارغة.',bodies)}

/* ---------- (b) match ---------- */
function lt(d){return d.l+' '+d.l.toLowerCase()}
function sheetMatch(){
  var ls=selSorted().map(function(l){return L[IDX[l]]}),hasX=ls.some(function(d){return d.end});
  var bodies=chunk(ls,6).map(function(g,pi){
    var r=rng(T.seed*131+pi*7+1),o=g.slice();
    for(var t=0;t<30&&g.length>1;t++){o=sh(g,r);if(o.every(function(x,i){return x!==g[i]}))break}
    return '<div class="te-match">'+g.map(function(d,i){return '<div class="te-mrow">'+emoBox(d,'te-pic')+'<i class="te-circ"></i><span class="te-mmid"></span><i class="te-circ"></i><span class="te-let">'+lt(o[i])+'</span></div>'}).join('')+'</div>'+noPicNote(g)});
  return pages('صِل الصورة بالحرف','اختر الحرف الذي يبدأ به اسم الصورة، ثم ارسم خطًّا بين الدائرتين.'+(hasX?' (صورة الصندوق box تنتهي بالحرف x)':''),bodies)}

/* ---------- (c) CVC ---------- */
function boxes(w){
  var ch=w.split(''),m=T.mode;
  return '<div class="te-bx">'+ch.map(function(c,i){var show=(m==='first'&&i===0)||(m==='mid'&&(i===0||i===ch.length-1));return '<i'+(show?' class="g"':'')+'>'+(show?E(c):'')+'</i>'}).join('')+'</div>'}
function sheetCvc(){
  var ws=cvcWords();
  if(!ws.length)return pages('كلمات CVC','',['<p>لا توجد كلمات ذات صور واضحة لهذه المرحلة. ابحث عن صورة مناسبة للكلمة: '+cvcSkipped().map(function(w){return '<span class="te-en">'+E(w)+'</span>'}).join(' · ')+'</p>']);
  var sk=cvcSkipped(),nb=chunk(ws,8).length;
  var bodies=chunk(ws,8).map(function(g,pi){
    var bank=sh(g.map(function(w){return w.w}),rng(T.seed*17+pi));
    return '<div class="te-bank"><small>بنك الكلمات — انظر إلى الصورة واكتب الحروف في الخانات</small>'+bank.map(function(w){return '<span class="te-en">'+E(w)+'</span>'}).join('')+'</div>'+
     '<div class="te-cvc">'+g.map(function(w){return '<div class="te-ci"><span class="te-pic" aria-hidden="true">'+w.emoji+'</span>'+boxes(w.w)+'</div>'}).join('')+'</div>'+(pi===nb-1&&sk.length?'<p class="te-pn">ابحث عن صورة مناسبة للكلمة (استُبعدت لأن صورتها غير واضحة بالأبيض والأسود): '+sk.map(function(w){return '<span class="te-en">'+E(w)+'</span>'}).join(' · ')+'</p>':'')});
  return pages('اكتب الكلمة تحت الصورة','المرحلة '+N(T.stage+1)+' — انطق الأصوات ببطء ثم اكتب كل صوت في خانة.',bodies)}

/* ---------- (d) flashcards ---------- */
function sheetFlash(){
  var ls=selSorted().map(function(l){return L[IDX[l]]});
  var bodies=chunk(ls,6).map(function(g){
    var cells=g.map(function(d){return '<div class="te-fc"><span class="cut" aria-hidden="true">✂</span><span class="lt">'+d.l+d.l.toLowerCase()+'</span>'+emoBox(d,'te-emo')+'<span class="wd">'+E(d.word)+'</span></div>'});
    while(cells.length<6)cells.push('<div class="te-fc"></div>');
    return '<div class="te-fl">'+cells.join('')+'</div>'+noPicNote(g)});
  return pages('بطاقات الحروف','قصّ على الخطوط المتقطعة. ستة بطاقات في كل صفحة.',bodies)}

/* ---------- (e) tracker ---------- */
function sheetTrack(){
  var land=T.orient==='l',cap=land?10:8,ls=selSorted().slice(0,cap),n=T.rows;
  var head='<tr><th>اسم الطالب</th>'+ls.map(function(l){return '<th><span class="te-en">'+l.toLowerCase()+'</span></th>'}).join('')+'<th>يكتب ✍️</th><th>يمزج 🔗</th><th>ملاحظات</th></tr>';
  var idx=[];for(var i=1;i<=n;i++)idx.push(i);
  var bodies=chunk(idx,land?14:20).map(function(g){
    return '<table class="te-tb"><thead>'+head+'</thead><tbody>'+g.map(function(i){return '<tr><td><span class="n">'+N(i)+'.</span></td>'+ls.map(function(){return '<td></td>'}).join('')+'<td></td><td></td><td></td></tr>'}).join('')+'</tbody></table>'+
     '<p class="te-lg">الصف: ______________ &nbsp; المعلم: ______________ &nbsp;|&nbsp; ✓ أتقن &nbsp; ○ في الطريق &nbsp; (اكتب تاريخ الملاحظة في خانة الملاحظات)</p>'});
  return pages('متابعة الصف','ضع علامة ✓ عند إتقان الطالب للصوت، أو ○ إن كان في الطريق.',bodies,land)}

/* ---------- lesson plan ---------- */
function chant(d,v){
  var s=snd(d.l),w=d.word,x='/'+s+'/';
  var C=[
   [['Clap, clap, hello! ','صفّق مرتين'],['Stamp, stamp, hello! ','اضرب الأرض بقدميك'],['Today our sound is '+x+' '+x+' '+x+',','ارفع إصبعًا'],[w+', '+w+', '+x+' '+x+' '+x+'!','أشر إلى الصورة']],
   [['Knees, knees, tap, tap, tap, ','اضرب ركبتيك'],['Shoulders, shoulders, clap, clap, clap, ','المس كتفيك ثم صفّق'],['Hear the sound: '+x+' '+x+' '+x+',','ضع يدك على أذنك'],[w+' has '+x+' — snap, snap, snap!','فرقعة بالأصابع']],
   [['One, two, three, look at me, ','أشر إلى نفسك'],[w+', '+w+', what do you see? ','أرِ البطاقة'],[x+' '+x+' '+x+', say it with me, ','أشر للأطفال'],[x+' for '+w+', happy as can be!','ابتسم وصفّق']]];
  return C[v%C.length]}
function game(v,focus,pool){
  var r=rng(T.seed*53+v),A=focus[0],B=focus[1]||focus[0],cw=cvcWords();
  var dis=sh(pool.filter(function(d){return focus.indexOf(d.l)<0}),r).slice(0,4).map(function(d){return d.word});
  var fw=focus.map(function(l){return L[IDX[l]].word});
  var g=v%4;
  if(g===0){var seq=sh(fw.concat(fw).concat(dis),r);return {t:'اقفز أو انحنِ',p:'قل الكلمات ببطء. إذا بدأت الكلمة بالصوت '+en('/'+snd(A)+'/')+(B!==A?' أو '+en('/'+snd(B)+'/'):'')+' يقفز الأطفال، وإلا ينحنون. الكلمات:',w:seq.join(' · ')}}
  if(g===1){return {t:'أين البطاقة؟',p:'وزّع بطاقات الحروف (من تبويب «بطاقات») في أنحاء الغرفة. قل الكلمة ويمشي الأطفال إلى البطاقة الصحيحة ويلمسونها. عبارة المعلم: '+en('Show me the '+fw[0]+'!')+'.',w:fw.concat(dis.slice(0,2)).join(' · ')}}
  if(g===2){var cs=(cw.length?cw:[{w:fw[0],sounds:[A.toLowerCase()]}]).slice(0,4);return {t:'الروبوت يمزج الأصوات',p:'تكلّم كالروبوت: ببطء، صوت بعد صوت، ثم يجمع الأطفال الصوت في كلمة بسرعة ويصفّقون. ابدأ من الأسهل.',w:cs.map(function(w){return w.sounds?w.sounds.join('-')+' → '+w.w:w.w}).join(' · ')}}
  return {t:'كيس الأصوات',p:'ضع بطاقات الصور في كيس. يسحب طالب بطاقة ويقول الكلمة وصوتها الأول، ثم يكررها الصف بصوت واحد. من قال الكلمة الصحيحة يسمع '+en('Great job!')+'.',w:fw.concat(dis.slice(0,2)).join(' · ')}}
function sheetPlan(){
  var fl=selSorted().slice(0,2);if(!fl.length)fl=stLetters(T.stage).slice(0,2);
  var d1=L[IDX[fl[0]]],d2=fl[1]?L[IDX[fl[1]]]:null;
  var st=F.ST[Math.min(T.stage,F.ST.length-1)],pool=L.filter(function(d){return F.ST.slice(0,Math.min(T.stage,F.ST.length-1)+1).some(function(s){return s.letters.indexOf(d.l.toLowerCase())>=0})});
  if(pool.length<4)pool=L;
  var ch=chant(d1,T.variant),gm=game(T.variant+T.stage,fl,pool);
  var sk=(D.strokes&&D.strokes.lower&&D.strokes.lower[d1.l.toLowerCase()])||[];
  function sec(min,title,inner){return '<div class="te-ps"><div class="te-pt"><b>'+N(min)+'</b><span>دقائق</span></div><div class="te-pc"><h3>'+title+'</h3>'+inner+'</div></div>'}
  var introWords=[d1].concat(d2?[d2]:[]).map(function(d){return '<p>'+en(d.l+' '+d.l.toLowerCase())+' = '+en(d.word)+' '+d.emoji+' ('+E(d.ar)+') — الصوت: '+en('/'+snd(d.l)+'/')+(d.end?' (في آخر الكلمة)':'')+'</p>'}).join('');
  var body='<div class="te-pl">'+
   sec(2,'١) الإحماء: هتاف الصباح',
     '<div class="te-ch">'+ch.map(function(c){return '<div>'+E(c[0])+'<small>('+c[1]+')</small></div>'}).join('')+'</div><p>كرّر الهتاف مرتين: مرة بصوت منخفض ومرة بصوت عالٍ.</p>')+
   sec(2,'٢) تقديم الصوت',
     '<p>أرِ البطاقة وقل الصوت لا اسم الحرف، ثلاث مرات، والأطفال يردّدون مع النظر إلى شفتيك.</p>'+introWords+'<p>اسأل: '+en('What starts with '+(d1.end?'… (x is at the end of box)':'/'+snd(d1.l)+'/')+'?')+'</p>')+
   sec(3,'٣) اللعبة: '+gm.t,'<p>'+gm.p+'</p><div class="te-ch">'+E(gm.w)+'</div>')+
   sec(2,'٤) الكتابة',
     '<p>اكتبوا الحرف '+en(d1.l+' '+d1.l.toLowerCase())+' في الهواء بإصبعين وأنت تقول الصوت'+(sk.length?'، ('+N(sk.length)+' '+(sk.length===1?'خطّ':'خطوط')+' للحرف الصغير)':'')+'. ثم وزّع ورقة «تتبّع الحروف»: نبدأ من النقطة المرقّمة 1 ونتبع النقاط.</p>')+
   sec(1,'٥) الختام',
     '<p>اطلب من كل طفل أن يقول كلمة تبدأ بصوت اليوم أو يشير إلى صورتها. ثم: '+en('Well done! High five! See you next time!')+'</p>')+
   '</div>'+
   '<p class="te-ml"><b>المواد:</b> بطاقات الحروف (من تبويب «بطاقات») · ورقة التتبّع · أقلام رصاص · كيس صغير (للّعبة).</p>'+
   '<p class="te-ml"><b>عبارات الصف:</b> '+['Look!','Listen!','Say it with me.','Your turn.','Sit down.','Stand up.'].map(en).join(' · ')+'</p>'+
   '<p class="te-nt"><b>ملاحظة للمعلم:</b> '+E(st.tipAr)+' ثبّت القاعدة: «نبدأ بالمرح، ونحتفل بكل محاولة».</p>';
  return pages('خطة درس: ١٠ دقائق','المرحلة '+N(T.stage+1)+' — الأصوات: '+fl.map(function(l){return '<span class="te-en">'+l.toLowerCase()+'</span>'}).join(' و '),[body])}

/* ---------- UI ---------- */
function seg(arr,cur,act,key){return '<div class="seg">'+arr.map(function(x){return '<button data-a="teacher:'+act+'" data-v="'+x[0]+'" aria-pressed="'+(String(x[0])===String(cur))+'">'+x[1]+'</button>'}).join('')+'</div>'}
function uiHtml(){
  var needL=T.type!=='cvc';
  var h='<div class="card"><span class="te-lbl" style="margin-top:0">١. نوع الورقة</span>'+seg(TYPES,T.type,'type')+
   '<span class="te-lbl">٢. المرحلة</span>'+seg([0,1,2,3,4,5].map(function(i){return [i,i<5?N(i+1):'مراجعة']}),T.stage,'stage');
  if(needL){
    h+='<span class="te-lbl">٣. الحروف '+(T.type==='track'?(T.orient==='l'?'(حتى ١٠)':'(حتى ٨)'):'')+'</span><div class="grid" role="group" aria-label="اختيار الحروف">'+L.map(function(d){return '<button class="k'+(T.sel.indexOf(d.l)>=0?' on':'')+'" data-a="teacher:let" data-v="'+d.l+'" aria-pressed="'+(T.sel.indexOf(d.l)>=0)+'" lang="en">'+d.l+'</button>'}).join('')+'</div>'+
     '<div class="te-mini"><button class="btn ghost" data-a="teacher:all">كل الحروف</button><button class="btn ghost" data-a="teacher:none">مسح</button><button class="btn ghost" data-a="teacher:stg">حروف المرحلة</button></div>'}
  if(T.type==='trace')h+='<span class="te-lbl">الحالة</span>'+seg([['lower','صغير a'],['upper','كبير A'],['both','الاثنان']],T.kase,'kase');
  if(T.type==='cvc')h+='<span class="te-lbl">الصعوبة</span>'+seg([['all','كل الحروف'],['first','الحرف الأول معطى'],['mid','الوسط ناقص']],T.mode,'mode');
  if(T.type==='track')h+='<span class="te-lbl">اتجاه الورقة</span>'+seg([['p','طولي (٨ حروف)'],['l','عرضي (١٠ حروف)']],T.orient,'orient')+'<span class="te-lbl">عدد الطلاب</span>'+seg([[10,N(10)],[20,N(20)],[30,N(30)]],T.rows,'rows');
  if(T.type==='match')h+='<div class="te-mini"><button class="btn ghost" data-a="teacher:shuffle">🔀 ترتيب جديد</button></div>';
  if(T.type==='plan')h+='<div class="te-mini"><button class="btn ghost" data-a="teacher:variant">🔁 خطة أخرى</button></div>';
  h+='<button class="btn block" style="margin-top:14px" data-a="teacher:print">🖨️ طباعة</button><p class="te-hint">الورقة بحجم A4 وأبيض وأسود. في نافذة الطباعة اختر «الهوامش: لا شيء» وألغِ «الرؤوس والتذييلات».</p></div>';
  return h}
function sheet(){
  try{
    if(T.type!=='cvc'&&T.type!=='plan'&&!T.sel.length)return '<div class="card"><p>اختر حرفًا واحدًا على الأقل.</p></div>';
    switch(T.type){case 'trace':return sheetTrace();case 'match':return sheetMatch();case 'cvc':return sheetCvc();case 'flash':return sheetFlash();case 'track':return sheetTrack();default:return sheetPlan()}
  }catch(e){return '<div class="card"><p>تعذّر إنشاء الورقة.</p></div>'}}
function scale(){var o=document.getElementById('te-out');if(!o)return;var w=o.clientWidth||o.parentNode.clientWidth||360;o.style.setProperty('--tes',String(Math.min(1,w/(T.type==='track'&&T.orient==='l'?1122.5:793.7))))}
function paint(){var u=document.getElementById('te-ui'),o=document.getElementById('te-out');if(!u||!o)return;u.innerHTML=uiHtml();o.innerHTML=sheet();scale()}
function view(){return '<h1>ركن المعلم 👩‍🏫</h1><p class="lead">أوراق عمل جاهزة للطباعة، وخطة درس من ١٠ دقائق.</p><div class="te-ui" id="te-ui">'+uiHtml()+'</div><div class="te-out" id="te-out">'+sheet()+'</div>'}
function init(){document.body.classList.add('te-on');scale();if(!window.__teRs){window.__teRs=1;window.addEventListener('resize',scale)}}
function act(a,v){
  if(a==='type'){T.type=v}
  else if(a==='stage'){setStage(+v)}
  else if(a==='let'){var k=T.sel.indexOf(v);if(k>=0)T.sel.splice(k,1);else T.sel.push(v)}
  else if(a==='all'){T.sel=L.map(function(d){return d.l})}
  else if(a==='none'){T.sel=[]}
  else if(a==='stg'){T.sel=stLetters(T.stage)}
  else if(a==='kase'){T.kase=v}
  else if(a==='mode'){T.mode=v}
  else if(a==='rows'){T.rows=+v}
  else if(a==='orient'){T.orient=v==='l'?'l':'p'}
  else if(a==='shuffle'){T.seed++}
  else if(a==='variant'){T.variant++;T.seed++}
  else if(a==='print'){try{window.print()}catch(e){F.toast('تعذّرت الطباعة')}return}
  saveOpts();paint()}

F.register('teacher',{icon:'👩‍🏫',title:'ركن المعلم',sub:'أوراق عمل للطباعة',home:true,view:view,init:init,act:act});
})();

</script>
<script>/* module: words.js */
/* words module: كلمات بالصور (themes, learn, games, Leitner review) */
(function(){
'use strict';
var FD=window.FD;if(!FD)return;
var D=FD.DATA,TH=D.themes,esc=FD.esc,num=FD.num,S=FD.Store,shuffle=FD.shuffle,pick=FD.pick;

/* ---------- css ---------- */

'.wd-mode .ic{flex:none;min-width:60px;font-size:30px;text-align:center;line-height:1.1}.wd-mode b{font-size:1.15rem}.wd-mode small{display:block;color:var(--muted)}'+

'@keyframes wdin{from{opacity:0;transform:scale(.92)}}'+

'.wd-num{display:inline-grid;place-items:center;width:1em;height:1em;border-radius:26%;background:linear-gradient(145deg,#fff,var(--gold-soft));border:.04em solid var(--gold);vertical-align:middle}.wd-num b{font-size:.62em;line-height:1;color:var(--emerald);direction:ltr}'+
'.wd-emo{display:inline-block;line-height:1}'+
'.wd-q{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px;padding:16px 10px;border-radius:22px;background:var(--ivory);border:2px solid var(--line);box-shadow:var(--shadow);text-align:center}'+
'.wd-hear{width:104px;height:104px;border-radius:50%;border:3px solid var(--emerald);background:var(--emerald-l);font-size:52px;line-height:1;display:grid;place-items:center;touch-action:manipulation}'+
'.wd-hint{font-size:1.6rem;letter-spacing:.3em;direction:ltr}.wd-q .pic{font-size:104px;line-height:1.1}.wd-q .we{font-size:2.4rem;font-weight:800;direction:ltr;color:var(--emerald-d)}'+
'.wd-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;direction:ltr}'+
'.wd-o{min-height:104px;border-radius:20px;border:2.5px solid var(--line);background:var(--ivory);font-size:56px;line-height:1;display:grid;place-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:opacity .2s;position:relative}.wd-o .mk{position:absolute;top:4px;inset-inline-end:8px;font-size:22px;font-weight:800;line-height:1}.wd-o.good .mk{color:#1b7a3a}.wd-o.try .mk{color:#a86a00}'+
'.wd-o.good{background:#c9f0d4;border-color:var(--c4)}.wd-o.try{background:#fff1d6;border-color:var(--gold);animation:sh .3s}.wd-o.dim{opacity:.3}'+
'.wd-wopts{display:grid;gap:10px;margin-top:14px}.wd-wopts .wd-o{font-size:1.7rem;font-weight:800;min-height:68px;direction:ltr;color:var(--emerald-d)}'+
'.wd-mt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;direction:ltr}.wd-mt .wd-o{min-height:92px;width:100%}.wd-mt .wd-o.w{font-size:1.45rem;font-weight:800;color:var(--emerald-d)}'+
'.wd-o.sel{border-color:var(--emerald);background:var(--emerald-l);box-shadow:0 0 0 3px rgba(14,94,62,.25);border-style:dashed}.wd-o.hint{animation:wdh .8s 3}'+
'@keyframes wdh{50%{box-shadow:0 0 0 6px rgba(200,162,58,.6)}}'+
'.wd-end{display:grid;justify-items:center;gap:10px;text-align:center;padding:24px 8px}.wd-end .em{font-size:96px}.wd-end .st{font-size:2rem;letter-spacing:.1em}.wd-end .btn{width:100%}';
var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

/* ---------- data ---------- */
var COL={red:'#e53935',blue:'#1e66d0',green:'#2e9e57',yellow:'#fdd835',orange:'#fb8c00',purple:'#8e44ad',black:'#222',white:'#fff',brown:'#8d5a35',pink:'#f48fb1'};
var PAL=[['#e8643c','#fde8e0'],['#2f80d0','#e0eefb'],['#8b5cc8','#ece3f7'],['#2e9e57','#ddf3e5'],['#c8a23a','#fff2cc'],['#d6457a','#ffe3ec'],['#1f9d94','#dff5f3'],['#e08a2c','#ffe9d6']];
var BY={},DIG={},TID={};
TH.forEach(function(t,ti){TID[t.id]=t;t.ti=ti;t.words.forEach(function(w,i){BY[w.w]={w:w.w,emoji:w.emoji,ar:w.ar,t:t.id,ti:ti};if(t.id==='numbers')DIG[w.w]=i+1})});
function pic(w){var b=BY[w];if(b.t==='colors')return '<span class="wd-dot" style="background:'+COL[w]+'"></span>';if(DIG[w])return '<span class="wd-num"><b>'+DIG[w]+'</b></span>';return '<span class="wd-emo">'+b.emoji+'</span>'}
function styl(ti){var p=PAL[ti%PAL.length];return '--b:'+p[0]+';--t:'+p[1]}

/* ---------- store ---------- */
function wd(){var o=S.get('words',null)||{};o.seen=o.seen||{};o.rounds=o.rounds||{};return o}
function today(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)}
var IV=[1,2,5];
function leit(){return S.get('leitner',null)||{}}
function markSeen(w){var o=wd();if(!o.seen[w]){o.seen[w]=1;S.set('words',o)}var l=leit();if(!l[w]){l[w]={box:1,due:today()};S.set('leitner',l)}}
function dueList(){var l=leit(),t=today();return Object.keys(l).filter(function(w){return BY[w]&&l[w].due<=t}).sort(function(a,b){return l[a].box-l[b].box||l[a].due-l[b].due})}
function leitUpdate(w,ok){var l=leit(),e=l[w]||{box:1};e.box=ok?Math.min(3,e.box+1):1;e.due=today()+IV[e.box-1];l[w]=e;S.set('leitner',l)}
function seenCount(t){var s=wd().seen;return t.words.filter(function(w){return s[w.w]}).length}
function cards(n){return n===1?'بطاقة واحدة':n===2?'بطاقتان':num(n)+' بطاقات'}
function young(){return S.get('age','s')==='s'}

/* ---------- state & render ---------- */
var W={tok:0,tid:null,li:0,run:null,Q:null,M:null};
function app(){return document.getElementById('app')}
var TMR=[];
function render(html,after){W.tok++;clearT();app().innerHTML=html;window.scrollTo(0,0);if(after)after()}
function clearT(){TMR.forEach(clearTimeout);TMR=[]}
function later(fn,ms){var k=W.tok;var id=setTimeout(function(){if(k===W.tok)fn()},ms);TMR.push(id)}
function msg(t){var m=document.getElementById('wd-msg');if(m)m.textContent=t}
function mark(b,c){if(!b)return;var o=b.querySelector('.mk');if(o)o.remove();var m=document.createElement('span');m.className='mk';m.setAttribute('aria-hidden','true');m.textContent=c;b.appendChild(m)}
function leave(){W.tok++;clearT();W.run=null;W.Q=null;W.M=null;W.tid=null}
function navBtn(a,ic){return '<button class="wd-ic" '+A(a)+' aria-label="'+(a==='home'?'الموضوعات':'قائمة الموضوع')+'">'+ic+'<small aria-hidden="true">☰</small></button>'}
function A(a){return 'data-a="words:'+a+'"'}

/* ---------- screens ---------- */
function vThemes(){
  var n=dueList().length,sc=Object.keys(leit()).length;
  var sub=n?cards(n)+' جاهزة':(sc?'لا توجد بطاقات اليوم ✅':'تعلّم بعض الكلمات أولًا 📖');
  return '<h1>🖼️ كلمات بالصور</h1><p class="lead">اختر موضوعًا وتعلّم كلماته.</p>'+
  '<button class="wd-rev" '+A('review')+(n?'':' disabled')+'><span class="ic" aria-hidden="true">🔁</span><span><b>مراجعة اليوم</b><small>'+sub+'</small></span>'+(n?'<span class="bd">'+num(n)+'</span>':'')+'</button>'+
  '<div class="wd-themes">'+TH.map(function(t){var c=seenCount(t),p=Math.round(c/t.words.length*100);
    return '<button class="wd-th" style="'+styl(t.ti)+'" '+A('theme')+' data-v="'+t.id+'"><span class="ti" aria-hidden="true">'+t.emoji+'</span><b>'+esc(t.titleAr)+'</b><small lang="en">'+esc(t.titleEn)+'</small><div class="bar"><i style="width:'+p+'%"></i></div><span class="cn">'+num(c)+' / '+num(t.words.length)+'</span></button>'}).join('')+'</div>'}
function vMenu(){
  var t=TID[W.tid],c=seenCount(t),r=wd().rounds[t.id]||0;
  function mode(a,ic,ti,sb){return '<button class="wd-mode" style="'+styl(t.ti)+'" '+A(a)+'><span class="ic" aria-hidden="true">'+ic+'</span><span><b>'+ti+'</b><small>'+sb+'</small></span></button>'}
  return '<div class="wd-top">'+navBtn('home','🖼️')+'</div>'+
  '<div class="wd-hd" style="margin-top:14px"><span class="ti" aria-hidden="true">'+t.emoji+'</span><div><h1>'+esc(t.titleAr)+'</h1><p class="lead">'+num(c)+' من '+num(t.words.length)+' كلمات تعلّمتها</p></div></div>'+
  '<div class="wd-modes">'+mode('learn','📖','تعلّم الكلمات','المس البطاقة لتسمع')+mode('hear','👂👆','اسمع واختر الصورة','٥ أسئلة')+mode('match','🔗','طابق الكلمة بالصورة','٤ أزواج')+mode('quiz','⭐','اختبار صغير','٦ أسئلة')+'</div>'+
  (r?'<p class="lead" style="text-align:center;margin-top:12px">أكملت '+num(r)+' جولات 🎉</p>':'')}
function dots(n,i){var h='';for(var k=0;k<n;k++)h+='<i class="'+(k<i?'d':k===i?'c':'')+'"></i>';return '<span class="wd-dots" aria-hidden="true">'+h+'</span>'}
function vLearn(){
  var t=TID[W.tid],n=t.words.length,i=W.li,w=t.words[i],last=i===n-1;
  markSeen(w.w);
  return '<div class="wd-top">'+navBtn('menu',t.emoji)+dots(n,i)+'</div>'+
  '<div class="wd-card" id="wd-card" style="'+styl(t.ti)+'" '+A('say')+' role="button" tabindex="0" aria-label="اسمع: '+esc(w.w)+' - '+esc(w.ar)+'"><div class="pic">'+pic(w.w)+'</div><div class="we" lang="en">'+esc(w.w)+'</div><div class="wa">'+esc(w.ar)+'</div></div>'+
  '<div class="wd-sp"><button class="btn ghost" '+A('say')+' aria-label="اسمع">🔊</button><button class="btn ghost" '+A('slow')+' aria-label="ببطء">🐢</button></div>'+
  '<div class="wd-nav"><button class="btn ghost" '+A('prev')+(i?'':' disabled style="opacity:.4"')+' aria-label="السابق">▶</button>'+
  (last?'<button class="btn" '+A('menu')+' aria-label="تم">✅</button>':'<button class="btn" '+A('next')+' aria-label="التالي">◀</button>')+'</div>'}
function learnAfter(){
  var el=document.getElementById('wd-card');if(!el)return;var x0=null,y0=0;
  el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();FD.say(TID[W.tid].words[W.li].w)}else if(e.key==='ArrowLeft'){go(1)}else if(e.key==='ArrowRight'){go(-1)}});
  el.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  el.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){el.setAttribute('data-sw','1');setTimeout(function(){el.removeAttribute('data-sw')},400);go(dx<0?1:-1)}},{passive:true}); /* RTL: finger right-to-left = next (next button is on the left) */
}
function go(d){var n=TID[W.tid].words.length,k=W.li+d;if(k<0||k>=n)return;W.li=k;showLearn(true)}
function showLearn(sp){render(vLearn(),learnAfter);if(sp)FD.say(TID[W.tid].words[W.li].w)}

/* ---------- question engine (hear / quiz / review) ---------- */
function distract(w){var t=TID[BY[w].t];return shuffle(t.words.filter(function(x){return x.w!==w})).slice(0,2).map(function(x){return x.w})}
function startRun(kind,tid){
  var pool,types,y=young();
  if(kind==='review'){pool=dueList().slice(0,10);types=pool.map(function(_,i){return y?'hp':(i%2?'hp':'pw')})}
  else{var t=TID[tid];if(kind==='hear'){pool=shuffle(t.words).slice(0,5).map(function(x){return x.w});types=pool.map(function(){return 'hp'})}
    else{pool=shuffle(t.words).slice(0,6).map(function(x){return x.w});types=pool.map(function(_,i){return y?'hp':['hp','pw','wp'][i%3]})}}
  W.run={kind:kind,tid:tid,list:pool.map(function(w,i){return {w:w,type:types[i]}}),i:0,good:0,upd:{}};
  nextQ()}
function nextQ(){
  var r=W.run;if(r.i>=r.list.length)return finishRun();
  var it=r.list[r.i];W.Q={w:it.w,type:it.type,miss:0,done:false,opts:shuffle([it.w].concat(distract(it.w)))};
  render(vQ(),function(){if(it.type!=='pw')FD.say(it.w)})}
function vQ(){
  var r=W.run,Q=W.Q,h,ns=!FD.canSpeak();
  if(Q.type==='hp')h='<button class="wd-hear" '+A('rep')+' aria-label="اسمع">👂</button>'+(ns?'<div class="we" dir="ltr" lang="en">'+esc(Q.w)+'</div>':'')+'<button class="btn ghost" '+A('slow')+' aria-label="ببطء">🐢</button><div class="wd-hint" aria-hidden="true">👂 ➜ 👆</div>';
  else if(Q.type==='wp')h='<div class="we" lang="en">'+esc(Q.w)+'</div><div><button class="btn ghost" '+A('rep')+' aria-label="اسمع">🔊</button> <button class="btn ghost" '+A('slow')+' aria-label="ببطء">🐢</button></div><div class="wd-hint" aria-hidden="true">👆</div>';
  else h='<div class="pic">'+pic(Q.w)+'</div><div class="wd-hint" aria-hidden="true">👆</div>';
  var o=Q.type==='pw'?'<div class="wd-wopts">'+Q.opts.map(function(x,i){return '<button class="wd-o" lang="en" '+A('ans')+' data-i="'+i+'">'+esc(x)+'</button>'}).join('')+'</div>'
   :'<div class="wd-opts">'+Q.opts.map(function(x,i){return '<button class="wd-o" '+A('ans')+' data-i="'+i+'" aria-label="'+esc(BY[x].ar)+'">'+pic(x)+'</button>'}).join('')+'</div>';
  return '<div class="wd-top">'+(r.kind==='review'?'':navBtn('menu',TID[r.tid].emoji))+dots(r.list.length,r.i)+'</div>'+(ns?'<p class="wd-ban" role="status">🔇 الصوت غير متاح — الكلمة مكتوبة</p>':'')+'<div class="wd-q">'+h+'</div>'+o+'<p class="msg" id="wd-msg" aria-live="polite"></p>'}
function answer(i,b){
  var Q=W.Q,r=W.run;if(!Q||Q.done)return;var w=Q.opts[i];
  if(w===Q.w){Q.done=true;b.classList.add('good');
    mark(b,'✓');document.querySelectorAll('.wd-o').forEach(function(x){x.disabled=true});
    msg(pick(D.praise.good));FD.cheer(true);
    if(!Q.miss)r.good++;
    if(r.kind==='review'&&!r.upd[Q.w]){r.upd[Q.w]=1;leitUpdate(Q.w,!Q.miss)}
    r.i++;later(nextQ,1500)}
  else{Q.miss++;b.classList.add('try');mark(b,'↻');b.disabled=true;msg(pick(D.praise.retry));FD.cheer(false);
    if(Q.miss>=2)document.querySelectorAll('.wd-o').forEach(function(x){if(x.getAttribute('data-i')!=String(Q.opts.indexOf(Q.w)))x.classList.add('dim')})}}
function endScreen(o){
  return '<div class="wd-end"><div class="em pop">🎉</div>'+(o.stars||'')+(o.line?'<p class="lead">'+o.line+'</p>':'')+'<button class="btn block" style="min-height:64px" '+A(o.again)+'>جولة جديدة</button><a class="btn ghost block" style="min-height:64px" href="#/">استراحة</a></div>'}
function finishRun(){
  var r=W.run,o=wd(),n=r.list.length,s='<div class="st" aria-label="'+r.good+' نجوم">'+(r.good?new Array(r.good+1).join('⭐'):'👏')+'</div>';
  if(r.kind==='review'){if(r.good>=3)FD.award('words',1,3);
    render(endScreen({stars:s,line:'🔁 '+num(n),again:dueList().length?'review':'home'}))}
  else{if(r.good*10>=n*6)FD.award('words',1,3);
    o.rounds[r.tid]=(o.rounds[r.tid]||0)+1;S.set('words',o);
    render(endScreen({stars:s,again:r.kind}))}}

/* ---------- matching game ---------- */
function startMatch(){
  var t=TID[W.tid],ws=shuffle(t.words).slice(0,4).map(function(x){return x.w});
  W.M={pics:shuffle(ws),wds:shuffle(ws),done:{},n:0,sel:null,wrong:0,miss:0};
  var M=W.M;
  render('<div class="wd-top">'+navBtn('menu',t.emoji)+'<span class="wd-hint" aria-hidden="true" style="margin-inline-start:auto">👆🔗👆</span></div>'+
  '<div class="wd-mt">'+[0,1,2,3].map(function(k){return '<button class="wd-o" '+A('m')+' data-v="'+M.pics[k]+'" data-i="0" aria-label="'+esc(BY[M.pics[k]].ar)+'">'+pic(M.pics[k])+'</button><button class="wd-o w" lang="en" '+A('m')+' data-v="'+M.wds[k]+'" data-i="1">'+esc(M.wds[k])+'</button>'}).join('')+'</div>'+
  '<p class="msg" id="wd-msg" aria-live="polite"></p>')}
function tapM(w,side,b){
  var M=W.M;if(!M||M.done[w])return;FD.say(w);
  var all=function(sel){return document.querySelectorAll(sel)};
  all('.wd-o.hint').forEach(function(x){x.classList.remove('hint')});
  if(!M.sel||M.sel.side===side){if(M.sel)M.sel.btn.classList.remove('sel');M.sel={w:w,side:side,btn:b};b.classList.add('sel');return}
  var s=M.sel;M.sel=null;s.btn.classList.remove('sel');
  if(s.w===w){M.done[w]=1;M.n++;M.wrong=0;[s.btn,b].forEach(function(x){x.classList.add('good');mark(x,'✓');x.disabled=true});msg(pick(D.praise.good));FD.cheer(true);
    if(M.n>=4){var o=wd();o.rounds[W.tid]=(o.rounds[W.tid]||0)+1;S.set('words',o);var got=M.miss<=3?FD.award('words',1,3):0;later(function(){render(endScreen({stars:'<div class="st">'+(M.miss<=3?'⭐':'👏')+'</div>',again:'match'}))},1300)}}
  else{M.wrong++;M.miss++;FD.cheer(false);[s.btn,b].forEach(function(x){x.classList.add('try');mark(x,'↻')});later(function(){[s.btn,b].forEach(function(x){x.classList.remove('try');var k=x.querySelector('.mk');if(k)k.remove()})},700);msg(pick(D.praise.retry));
    if(M.wrong>=2){all('.wd-o[data-v="'+s.w+'"]').forEach(function(x){if(+x.getAttribute('data-i')!==s.side)x.classList.add('hint')})}}}

/* ---------- module ---------- */
function reset(){leave()}
FD.register('words',{icon:'🖼️',title:'كلمات بالصور',sub:'حيوانات، ألوان، أرقام...',home:true,
  view:function(){reset();return vThemes()},
  init:function(){},leave:leave,
  act:function(a,v,i,b){
    var cur=function(){return TID[W.tid].words[W.li].w};
    switch(a){
      case 'home':reset();render(vThemes());break;
      case 'theme':W.tid=v;render(vMenu());break;
      case 'menu':W.run=null;W.Q=null;W.M=null;render(vMenu());break;
      case 'learn':W.li=0;showLearn(true);break;
      case 'say':if(b.getAttribute('data-sw'))break;FD.say(cur());break;
      case 'slow':if(W.Q)FD.say(W.Q.w,true);else FD.say(cur(),true);break;
      case 'next':go(1);break;
      case 'prev':go(-1);break;
      case 'rep':if(W.Q)FD.say(W.Q.w);break;
      case 'hear':startRun('hear',W.tid);break;
      case 'quiz':startRun('quiz',W.tid);break;
      case 'review':if(!dueList().length){FD.toast('لا توجد بطاقات اليوم ✅');break}startRun('review',null);break;
      case 'match':startMatch();break;
      case 'm':tapM(v,i,b);break;
      case 'ans':answer(i,b);break}
  }});
})();

</script>

<script>FD.start();</script>
