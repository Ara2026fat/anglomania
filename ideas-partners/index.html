<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مختبر أفكار أنجلومانيا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0F4A3A;--green2:#166B53;--gold:#C8A23A;--gold2:#9E7E22;--cream:#FEFDF5;--sand:#F6EFD6;--ink:#17302A;--muted:#5C6B66;--line:#E4DFC9;
  --c-start:#C8A23A;--c-dev:#1E8E6E;--c-mkt:#E2673A;--c-bold:#7B4FD1;--c-risk:#C9404B;--c-cur:#2F7BC4;
  --accent:var(--c-start);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Cairo,system-ui,sans-serif;background:var(--cream);color:var(--ink);overflow:hidden;line-height:1.6}
.app{height:100dvh;display:flex;flex-direction:column;position:relative;
  background:
   radial-gradient(900px 420px at 100% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),
   radial-gradient(700px 380px at -10% 110%,color-mix(in srgb,var(--green) 10%,transparent),transparent 70%),var(--cream);
  transition:background .4s}
header{display:flex;align-items:center;gap:14px;padding:12px clamp(12px,3vw,28px) 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--green);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 4px 0 var(--gold)}
.brand h1{margin:0;font-size:clamp(16px,2.2vw,22px);font-weight:800;color:var(--green);line-height:1.15}
.brand small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.sum{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sum span{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700;color:var(--green)}
.sum b{color:var(--accent);filter:brightness(.85)}
nav{display:flex;gap:8px;padding:6px clamp(12px,3vw,28px) 10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:14px;padding:9px 18px;border-radius:14px;background:#fff;color:var(--ink);
  box-shadow:0 2px 0 var(--line);display:flex;gap:8px;align-items:center;transition:transform .15s,box-shadow .15s,background .15s}
.tab i{font-style:normal;font-size:17px}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected=true]{background:var(--tc);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 60%,#000)}
.tab .n{background:rgba(0,0,0,.08);border-radius:99px;padding:0 8px;font-size:12px}
.tab[aria-selected=true] .n{background:rgba(255,255,255,.25)}
main{flex:1;min-height:0;overflow-y:auto;padding:4px clamp(12px,3vw,28px) 70px;scroll-behavior:smooth}
.lead{display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--line);border-inline-start:6px solid var(--accent);border-radius:16px;padding:10px 16px;margin-bottom:14px;font-size:14px;color:var(--muted)}
.lead b{color:var(--ink)}
.lead .em{font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 14px 12px;cursor:pointer;text-align:start;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}
.card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--accent)}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px -12px var(--accent);border-color:var(--accent);outline:0}
.card h3{margin:0;font-size:15.5px;font-weight:800;color:var(--green);padding-inline-start:6px}
.card p{margin:0;font-size:13px;color:var(--muted);padding-inline-start:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-inline-start:6px;margin-top:auto}
.chip{font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--sand);color:var(--gold2)}
.chip.g{background:#E3F1EB;color:var(--green2)}
.chip.r{background:#FBE5E7;color:var(--c-risk)}
.chip.b{background:#E4EEF9;color:var(--c-cur)}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots s{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.dots s.on{background:var(--accent)}
.star{align-self:flex-start;margin-inline-start:6px;background:var(--gold);color:#3b2f06;font-size:11px;font-weight:800;padding:0 9px;border-radius:99px;line-height:1.7}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.box{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.box h4{margin:0 0 8px;font-size:15px;font-weight:800;color:var(--green);display:flex;gap:8px;align-items:center}
.box ul{margin:0;padding-inline-start:18px;font-size:13.5px}
.box li{margin:4px 0}
.week{border-top:5px solid var(--accent)}
.week .wk{font-weight:800;color:var(--accent);filter:brightness(.8);font-size:13px}
.pill{display:inline-block;background:var(--sand);border-radius:10px;padding:1px 10px;margin:2px 0;font-weight:700;font-size:12.5px;color:var(--green)}
.top8{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.top8 button{font:inherit;font-weight:800;font-size:13px;border:0;cursor:pointer;border-radius:12px;padding:7px 14px;background:var(--green);color:#fff;box-shadow:0 3px 0 #082d23}
.top8 button span{color:var(--gold)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:start;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--green);font-size:12px;background:var(--sand)}
a{color:var(--c-cur);font-weight:700}
dialog{border:0;padding:0;background:transparent;max-width:min(620px,94vw);width:100%;margin:auto}
dialog::backdrop{background:rgba(15,40,32,.55);backdrop-filter:blur(3px)}
.sheet{background:var(--cream);border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -20px #000a;max-height:88dvh;display:flex;flex-direction:column}
.sh{background:var(--accent);color:#fff;padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.sh h2{margin:0;font-size:18px;font-weight:800;flex:1;line-height:1.35}
.x{border:0;background:rgba(255,255,255,.25);color:#fff;width:34px;height:34px;border-radius:10px;font-size:20px;cursor:pointer;flex:none}
.sb{padding:14px 18px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.sb .desc{font-size:14.5px;margin:0}
.row{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 12px}
.row b{display:block;font-size:12px;color:var(--gold2);margin-bottom:1px}
.row span{font-size:14px}
.row.hook span{font-weight:800;color:var(--green)}
footer{position:absolute;bottom:0;inset-inline:0;text-align:center;font-size:11.5px;color:var(--muted);padding:6px;background:linear-gradient(transparent,var(--cream) 40%);pointer-events:none;font-weight:600}
@media (max-width:640px){
  .sum span{display:none}
  .tab{padding:8px 13px;font-size:13px}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== وضع PDF ===== */
.pm body{overflow:visible;height:auto;background:#fff}
.pm .app,.pm dialog{display:none!important}
#doc{display:none}
.pm #doc{display:block;padding:0}
.pm *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dh{background:linear-gradient(135deg,var(--green),#0b3a2d);color:#fff;border-radius:18px;padding:26px 30px;margin-bottom:14px;border-bottom:6px solid var(--gold)}
.dh h1{margin:0 0 4px;font-size:30px;font-weight:800}
.dh p{margin:0;color:#E9E2C8;font-size:14px}
.dh .k{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.dh .k span{background:rgba(255,255,255,.14);border-radius:99px;padding:2px 14px;font-weight:700;font-size:13px}
.ds{break-before:page}
.ds:first-of-type{break-before:auto}
.dt{background:var(--sc);color:#fff;border-radius:14px;padding:10px 18px;font-size:19px;font-weight:800;margin:0 0 8px;display:flex;gap:10px;align-items:center}
.dl{font-size:13px;color:var(--muted);margin:0 0 10px;padding:0 4px}
.di{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dc{border:1.5px solid var(--line);border-inline-start:6px solid var(--sc);border-radius:14px;padding:10px 12px;break-inside:avoid;background:#fff}
.dc h3{margin:0 0 3px;font-size:14.5px;font-weight:800;color:var(--green)}
.dc p{margin:0 0 5px;font-size:12px;color:var(--muted)}
.dc .r{font-size:11.5px;margin-top:3px}
.dc .r b{color:var(--gold2)}
.dc .chips{padding:0;margin:4px 0}
.dc .chip{font-size:10.5px}
.pm .cols{grid-template-columns:1fr 1fr}
.pm .box{break-inside:avoid}
.pm .top8 button{box-shadow:none}
.pm .week{border-top-color:var(--sc)}
@page{size:A4;margin:10mm}
.pdfbtn{background:var(--green);color:#fff!important;text-decoration:none;border-radius:99px;padding:3px 14px;font-size:12px;font-weight:800;box-shadow:0 2px 0 #082d23}
</style>
</head>

  if(x.k==='dev') chips.push('<span class="chip g">بلا خادم</span>');

}

/* ===== العرض ===== */
let cur = 'start';
function counts(){ return {dev:1,mkt:3,bold:2}; }
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(t=>{
    const n = ({dev:14,mkt:16,bold:12})[t.id];
    return '<button class="tab" role="tab" id="t-'+t.id+'" aria-selected="'+(t.id===cur)+'" aria-controls="main" data-t="'+t.id+'" style="--tc:var('+t.c+')"><i>'+t.ico+'</i>'+t.label+(n?'<span class="n">'+n+'</span>':'')+'</button>';
  }).join('');
}
function show(id, push){
  cur = id; const t = TABS.find(x=>x.id===id);
  document.documentElement.style.setProperty('--accent','var('+t.c+')');
  $('#app').style.setProperty('--accent','var('+t.c+')');
  renderTabs();
  $('#main').innerHTML = '<div class="lead"><span class="em">'+t.ico+'</span><div>'+t.lead+'</div></div>'+VIEWS[id]();
  $('#main').scrollTop = 0;
  try{ if(push!==false) history.replaceState(null,'','#'+id); }catch(e){}
  const el = document.getElementById('t-'+id); if(el) el.scrollIntoView({inline:'center',block:'nearest'});
}
function open(id){
  const x = byId[id]; if(!x) return;
  const t = TABS.find(t=>t.id===x.k) || TABS[0];
  const sheet = $('#sheet'); sheet.style.setProperty('--accent','var('+t.c+')');
  const meta = '<div class="chips" style="padding:0;gap:8px"><span class="chip">الأثر '+dots(x.i)+'</span><span class="chip">الجهد: '+(EF[x.e]||'')+'</span>'+(x.cost?'<span class="chip g">التكلفة: '+esc(x.cost)+'</span>':'')+(x.when?'<span class="chip b">التوقيت: '+esc(x.when)+'</span>':'')+(x.late?'<span class="chip r">مؤجَّلة</span>':'')+'</div>';
  sheet.innerHTML = '<div class="sh"><h2>'+esc(x.t)+'</h2><button class="x" aria-label="إغلاق" id="cl">×</button></div><div class="sb"><p class="desc">'+esc(x.d)+'</p>'+meta+x.x.map(r=>'<div class="row '+(r[0]==='الجملة الجاهزة'?'hook':'')+'"><b>'+r[0]+'</b><span>'+esc(r[1])+'</span></div>').join('')+'</div>';
  const dlg = $('#dlg'); if(!dlg.open) dlg.showModal();
}
document.addEventListener('click',e=>{
  const tb = e.target.closest('[data-t]'); if(tb){ show(tb.dataset.t); return; }
  const c = e.target.closest('[data-id]'); if(c){ open(c.dataset.id); return; }
  if(e.target.id==='cl') $('#dlg').close();
  if(e.target.id==='dlg') $('#dlg').close();
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('dialog')) return;
  const ids = TABS.map(t=>t.id), i = ids.indexOf(cur);
  if(e.key==='ArrowLeft'&&i<ids.length-1) show(ids[i+1]);
  if(e.key==='ArrowRight'&&i>0) show(ids[i-1]);
});
$('#sum').innerHTML = '<span><b>13</b> فكرة مختارة</span><span><b>42</b> مقترحة</span><span><b>6</b> للبدء</span><a class="pdfbtn" href="anglomania-ideas.pdf" download>تحميل PDF</a>';
const h = (location.hash||'').slice(1);
show(TABS.some(t=>t.id===h)?h:'start', false);

/* ===== بناء وثيقة PDF ===== */
function buildDoc(){
  const ds = TABS.map(t=>{
    let body;
    if(['dev','mkt','bold'].includes(t.id)){
      body = '<div class="di">'+D.filter(x=>x.k===t.id).map(x=>{
        const ch = '<span class="chip">الأثر '+x.i+'/5</span><span class="chip">الجهد: '+(EF[x.e]||'')+'</span>'+(x.cost?'<span class="chip g">'+esc(x.cost)+'</span>':'')+(x.when?'<span class="chip b">'+esc(x.when)+'</span>':'')+(x.late?'<span class="chip r">مؤجَّلة</span>':'')+((TOP.includes(x.id)||x.star)?'<span class="chip" style="background:var(--gold);color:#3b2f06">★ ابدأ بها</span>':'');
        return '<div class="dc"><h3>'+esc(x.t)+'</h3><p>'+esc(x.d)+'</p><div class="chips">'+ch+'</div>'+x.x.map(r=>'<div class="r"><b>'+r[0]+':</b> '+esc(r[1])+'</div>').join('')+'</div>';
      }).join('')+'</div>';
    } else body = VIEWS[t.id]();
    return '<section class="ds" style="--sc:var('+t.c+');--accent:var('+t.c+')"><h2 class="dt"><span>'+t.ico+'</span>'+t.label+'</h2><p class="dl">'+t.lead.replace('اضغط أي بطاقة للتفاصيل. ','').replace('اضغط أي بطاقة للتفاصيل.','')+'</p>'+body+'</section>';
  }).join('');
  $('#doc').innerHTML = '<div class="dh"><h1>مختبر أفكار أنجلومانيا</h1><p>جولتان من البحث والنقد: تطوير المنصة، التسويق والربح، وأفكار جريئة</p><div class="k"><span>13 فكرة مختارة</span><span>من 42 مقترحة</span><span>6 للبدء</span></div></div>'+ds+'<p style="text-align:center;color:var(--muted);font-size:11px;margin-top:14px;font-weight:600">ARAFAT ALRAJHI © 2026 · anglomaniaedu.com</p>';
}
if(new URLSearchParams(location.search).has('pdf')){ document.documentElement.classList.add('pm'); buildDoc(); }
