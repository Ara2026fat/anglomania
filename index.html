<script>/* التشغيل | App bootstrap: الهيكل الثابت، التوجيه، تبديل اللغة */
(function () {
  'use strict';
  var A = window.ANG, t = function (k, v) { return A.i18n.t(k, v); }, esc = A.util.esc;
  var $ = function (s) { return document.querySelector(s); };
  var NAV = [
    { id: 'home', path: '/', key: 'nav.home', icon: 'home' },
    { id: 'grades', path: '/grades', key: 'nav.grades', icon: 'grid' },
    { id: 'request', path: '/request', key: 'nav.request', icon: 'whatsapp', cta: true },
    { id: 'teachers', path: '/teachers', key: 'nav.teachers', icon: 'lessons' },
    { id: 'about', path: '/about', key: 'nav.about', icon: 'info' }
  ];
  var lastRoute = null;

  function activeId(r) { return r.name === 'grade' ? 'grades' : (r.name === 'request' && r.query && r.query.a === 't') ? 'teachers' : r.name; }

  function qbar(r) {
    var ar = A.i18n.lang === 'ar', list = A.system.list(), cur = A.system.info(), items = [];
    var tile = function (name, tone) { return '<span class="t3d ' + tone + ' ts-md">' + name + '</span>'; };
    if (list.length > 1) {
      items.push('<details class="qsys" id="qsys"><summary class="qi" aria-label="' + esc(t('sys.change')) + '">' + tile(A.icon('curricula'), '') + '<b>' + esc(ar ? 'المنهج' : 'Curriculum') + '</b><span class="sub">' + esc(A.i18n.loc(cur).short) + ' ▾</span></summary><div class="qpanel">' +
        list.map(function (s) { return '<button type="button" class="sys-opt" data-sys="' + s.id + '" aria-pressed="' + (s.id === cur.id) + '">' + (s.id === cur.id ? A.icon('check') : '') + esc(A.i18n.loc(s).name) + '</button>'; }).join('') +
        '<a class="sys-other" href="#/request?grade=any&need=other">' + A.icon('whatsapp') + esc(t('sys.other')) + '</a></div></details>');
    }
    var soon = ar ? 'قريباً' : 'Soon';
    var chip = function (icon, tone, label) { return '<span class="qi soon" role="link" aria-disabled="true">' + tile(icon, tone) + '<b>' + label + '</b><span class="sub gold">' + soon + '</span></span>'; };
    items.push(chip(A.icon('stageElementary'), 'coral', ar ? 'ركن التأسيس' : 'Foundation Corner'));
    items.push(chip(A.icon('globe'), 'blue', ar ? 'ركن الكتب الأجنبية' : 'Foreign Books'));
    if (r && (r.name === 'home' || r.name === 'teachers')) items.push(chip(A.icon('stageSecondary'), 'violet', ar ? 'ركن كورسات المعلم' : 'Teacher Courses'));
    items.push('<a class="qi" href="admin.html">' + tile('<svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>', 'gold') + '<b>' + (ar ? 'لوحة التحكم' : 'Admin') + '</b></a>');
    $('#qbar').innerHTML = items.join('');
    $('#qbar').querySelectorAll('.t3d').forEach(function (e, i) { e.style.setProperty('--d', (i * 1.2) + 's'); });
    $('#qbar-w').hidden = !items.length;
  }

  function chrome(r) {
    var act = activeId(r);
    var cur = function (n) { return n.id === act ? ' aria-current="page"' : ''; };
    $('#top-nav').innerHTML = '<ul>' + NAV.map(function (n) {
      return '<li' + (n.cta ? ' class="cta"' : '') + '><a href="#' + n.path + '"' + cur(n) + '>' + esc(t(n.key)) + '</a></li>';
    }).join('') + '</ul>';
    $('#bottom-nav').innerHTML = '<ul>' + NAV.map(function (n) {
      var ic = A.icon(n.icon);
      return '<li' + (n.cta ? ' class="cta"' : '') + '><a href="#' + n.path + '"' + cur(n) + '>' +
        (n.cta ? '<span class="fab">' + ic + '</span><em>' : ic + '<span>') + esc(t(n.key)) + (n.cta ? '</em>' : '</span>') + '</a></li>';
    }).join('') + '</ul>';
    qbar(r);
    $('#lang-btn').innerHTML = A.icon('globe') + '<span>' + esc(t('lang.other')) + '</span>';
    $('#lang-btn').setAttribute('aria-label', t('lang.aria'));
    $('#brand-tag').textContent = t('brand.tag');
    $('#footer-note').textContent = t('footer.note');
    $('#footer-links').innerHTML = '<a href="#/audio">' + esc(t('audio.title')) + '</a><a href="#/about">' + esc(t('nav.about')) + '</a><a href="#/contact">' + esc(t('nav.contact')) + '</a><a href="#/setup">' + esc(t('footer.setup')) + '</a>';
    $('#credits').textContent = A.config.site.credits || '';
    $('#skip').textContent = t('skip');
    $('#top-nav').setAttribute('aria-label', t('nav.aria'));
    $('#bottom-nav').setAttribute('aria-label', t('nav.aria'));
  }

  function titleFor(r) {
    var k = { teachers: 'teachers.title', grades: 'grades.title', request: 'req.title', about: 'about.title', audio: 'audio.title', contact: 'contact.title', setup: 'setup.title', notfound: 'nf.title' }[r.name];
    if (r.name === 'grade') return A.views.gradeName(r.params.id) || t('nf.title');
    return k ? t(k) : t('brand.tag');
  }

  function render(r, keepScroll) {
    r = r || A.router.current();
    if (r.name === 'grade') A.system.follow(r.params.id); else if (r.query && r.query.grade) A.system.follow(r.query.grade);
    var v = A.views, html;
    switch (r.name) {
      case 'home': html = v.home(); break;
      case 'grades': html = v.grades(); break;
      case 'grade': html = v.grade(r.params.id, r.query); break;
      case 'request': html = v.request(r.query); break;
      case 'teachers': html = v.teachers(); break;
      case 'about': html = v.about(); break;
      case 'audio': html = v.audio(); break;
      case 'contact': html = v.contact(); break;
      case 'setup': html = v.setup(); break;
      default: html = v.notfound();
    }
    $('#main').innerHTML = html;
    chrome(r);
    var groups = {};
    $('#main').querySelectorAll('.tile,.svc,.step,.need,.pick,.chip,.channel,.card-plain,.stage-h,.sum,.card,.node').forEach(function (el, i) {
      el.style.setProperty('--i', Math.min(i, 14)); el.classList.add('rise');
    });
    document.title = (r.name === 'home' ? 'Anglomania — ' : '') + titleFor(r) + (r.name === 'home' ? '' : ' | Anglomania');
    if (!keepScroll) { window.scrollTo(0, 0); if (lastRoute) $('#main').focus({ preventScroll: true }); }
    lastRoute = r;
  }

  /* ميلان ثلاثي الأبعاد عند تمرير المؤشر (للأجهزة التي تدعم hover فقط) */
  function tilt() {
    if (!window.matchMedia || !matchMedia('(hover:hover) and (pointer:fine)').matches) return;
    var m = $('#main');
    m.addEventListener('pointermove', function (e) {
      var el = e.target.closest && e.target.closest('[data-tilt]'); if (!el) return;
      var b = el.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - .5, y = (e.clientY - b.top) / b.height - .5;
      el.style.setProperty('--ry', (x * 14).toFixed(1) + 'deg'); el.style.setProperty('--rx', (-y * 14).toFixed(1) + 'deg');
    });
    m.addEventListener('pointerout', function (e) {
      var el = e.target.closest && e.target.closest('[data-tilt]'); if (!el) return;
      el.style.setProperty('--ry', '0deg'); el.style.setProperty('--rx', '0deg');
    });
  }

  /* تبويب الفصول + نسخ نص الطلب */
  function delegates() {
    $('#main').addEventListener('click', function (e) {
      var tab = e.target.closest && e.target.closest('[data-term]');
      if (tab) {
        document.querySelectorAll('.term-tab').forEach(function (b) { b.setAttribute('aria-selected', String(b === tab)); });
        document.querySelectorAll('.term-panel').forEach(function (p) { p.hidden = p.id !== 'p-' + tab.getAttribute('data-term'); });
        return;
      }
      var sy = e.target.closest && e.target.closest('[data-sys]');
      if (sy) { A.system.set(sy.getAttribute('data-sys')); render(A.router.current(), true); return; }
      var cp = e.target.closest && e.target.closest('[data-copy]');
      if (cp) {
        var txt = cp.getAttribute('data-copy'), label = cp.textContent;
        var done = function () { cp.textContent = cp.getAttribute('data-done'); cp.classList.add('ok'); setTimeout(function () { cp.textContent = label; cp.classList.remove('ok'); }, 2200); };
        var fallback = function () {
          var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
          document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (x) { /* ignore */ } document.body.removeChild(ta);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
      }
    });
  }

  function init() {
    $('#qbar').addEventListener('click', function (e) { var sy = e.target.closest && e.target.closest('[data-sys]'); if (sy) { A.system.set(sy.getAttribute('data-sys')); render(A.router.current(), true); } });
    document.addEventListener('click', function (e) { var d = document.getElementById('qsys'); if (d && d.open && !d.contains(e.target)) d.open = false; });
    A.i18n.apply();
    A.router.onChange(function (r) { render(r); });
    $('#lang-btn').addEventListener('click', function () {
      A.i18n.set(A.i18n.lang === 'ar' ? 'en' : 'ar');
      render(A.router.current(), true);
    });
    tilt(); delegates();
    var stag = function () { var n = 0; document.querySelectorAll('.t3d').forEach(function (e) { if (e.closest('.qbar')) return; e.style.setProperty('--d', ((n++ % 10) * 1.2) + 's'); }); };
    new MutationObserver(stag).observe($('#main'), { childList: true }); stag();
    render(A.router.current());
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
