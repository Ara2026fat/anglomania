<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E5E3E">
<title>تسعير الملفات · Anglomania</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--em:#0E5E3E;--em2:#0A4530;--em3:#1FA571;--gold:#D4A72C;--goldD:#9E7E22;--goldS:#F6EBC8;--cream:#FBF7EA;--ink:#17302A;--muted:#5B6C65;--font:'Cairo',"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,#FFFFFA,#FBF7EA 60%,#F8F0CF);min-height:100vh;line-height:1.6}
button,input{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
header{text-align:center;padding:22px 0 8px}
header img{width:130px}
.tag{display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr;font-weight:900;letter-spacing:3px;font-size:11px;color:var(--em)}
.tag:before,.tag:after{content:"";width:36px;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}.tag:after{transform:scaleX(-1)}
h1{font-size:clamp(26px,6vw,40px);font-weight:900;color:var(--em);line-height:1.2;margin-top:6px}h1 em{font-style:normal;color:var(--gold)}
header p{color:var(--muted);font-weight:700;max-width:560px;margin:6px auto 0}
.how{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.how span{background:#fff;border:1.5px solid var(--gold);border-radius:99px;padding:4px 14px;font-weight:800;font-size:13px;color:var(--em2)}
.bar{position:sticky;top:0;z-index:20;background:rgba(254,253,245,.92);backdrop-filter:blur(10px);border-bottom:1.5px solid rgba(212,167,44,.4);padding:10px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 12px;border-radius:99px;background:#fff;border:2px solid var(--goldS);font-weight:900;color:var(--em2);transition:.15s}
.tab .o{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:radial-gradient(circle at 32% 28%,var(--a),var(--b));box-shadow:inset 0 -3px 5px rgba(0,0,0,.18),inset 0 2px 3px rgba(255,255,255,.4)}
.tab small{font-size:11px;color:var(--muted);font-weight:800;display:block;line-height:1}
.tab.on{border-color:var(--gold);background:linear-gradient(180deg,#FFF9DF,#FFF1B8);box-shadow:0 3px 0 var(--goldD)}
.tab.done .o:after{content:"✓";position:absolute;margin:-26px 0 0 -26px;background:var(--em3);color:#fff;border-radius:50%;width:15px;height:15px;font-size:11px;display:grid;place-items:center}
.prog{height:10px;border-radius:99px;background:var(--goldS);border:1.5px solid var(--gold);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--em3),var(--em));transition:width .4s}
.pt{display:flex;justify-content:space-between;font-weight:800;font-size:12px;color:var(--muted);margin-top:3px}
.sec{display:none;padding:16px 0 120px}.sec.on{display:block}
.sh{display:flex;align-items:center;gap:12px;margin:6px 0 14px}.sh .o{width:54px;height:54px;font-size:28px}
.sh h2{font-size:24px;font-weight:900;color:var(--em2);line-height:1.2}.sh p{color:var(--muted);font-weight:700;font-size:13px}
.bulk{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mini{padding:6px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--gold);font-weight:800;font-size:13px;color:var(--em2)}
.card{background:#fff;border:2px solid var(--goldS);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 0 var(--goldS);transition:.2s;position:relative}
.card.free{border-color:var(--em3);box-shadow:0 4px 0 #BFE8D2;background:linear-gradient(180deg,#fff,#F2FBF6)}
.card.paid{border-color:var(--gold);box-shadow:0 4px 0 var(--goldD);background:linear-gradient(180deg,#fff,#FFF8DC)}
.top{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--goldS);font-weight:900;color:var(--goldD);font-size:14px}
.card.free .num{background:var(--em3);color:#fff}.card.paid .num{background:var(--gold);color:#4a3a05}
.t{flex:1}.t b{display:block;font-weight:900;font-size:17px;color:var(--em2);line-height:1.35}.t span{display:block;color:var(--goldD);font-weight:800;font-size:13px;direction:ltr;text-align:start}
.t em{font-style:normal;font-size:12px;font-weight:800;color:var(--muted)}
.ch{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;border:2px solid var(--gold);border-radius:14px;overflow:hidden;background:#fff}
.sw button{padding:8px 16px;font-weight:900;color:var(--em2)}.sw .f.on{background:linear-gradient(180deg,var(--em3),var(--em));color:#FFF3C8}.sw .p.on{background:linear-gradient(180deg,#FFE184,var(--gold));color:#4a3a05}
.pr{display:none;gap:6px;align-items:center;flex-wrap:wrap;width:100%}.card.paid .pr{display:flex}
.pr .q button{padding:5px 11px;border-radius:99px;border:1.5px solid var(--gold);background:#fff;font-weight:900;font-size:13px;color:var(--em2)}.pr .q button.on{background:var(--gold);color:#4a3a05}
.pr input{width:96px;padding:7px 10px;border:2px solid var(--gold);border-radius:12px;font-weight:900;font-size:16px;text-align:center;direction:ltr;background:#fff}
.pr label{font-weight:800;font-size:13px;color:var(--muted)}
.foot{position:fixed;bottom:0;inset-inline:0;z-index:30;background:rgba(254,253,245,.95);backdrop-filter:blur(10px);border-top:2px solid var(--gold);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.foot .in{max-width:920px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:14px;font-weight:900;border:2px solid var(--goldD);background:linear-gradient(180deg,var(--em3),var(--em));color:#FFF3C8;box-shadow:0 3px 0 var(--em2)}
.btn.g{background:linear-gradient(180deg,#FFE184,var(--gold));color:#4a3a05;box-shadow:0 3px 0 var(--goldD)}.btn.w{background:#fff;color:var(--em2);box-shadow:0 3px 0 var(--goldD)}
.btn:active{transform:translateY(2px)}
.stat{flex:1;min-width:140px;font-weight:900;color:var(--em2);font-size:14px}.stat small{display:block;color:var(--muted);font-weight:800;font-size:12px}
.sum{background:#fff;border:2px solid var(--gold);border-radius:20px;padding:16px;margin-bottom:14px}
.sum table{width:100%;border-collapse:collapse;font-weight:800;font-size:14px}.sum td,.sum th{padding:7px 6px;border-bottom:1px solid var(--goldS);text-align:start}.sum th{color:var(--goldD);font-size:12px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--em2);color:#FFF3C8;padding:10px 18px;border-radius:99px;font-weight:800;z-index:50;display:none;max-width:90vw;text-align:center}
.done{display:none;text-align:center;padding:10px;font-weight:900;color:var(--em);font-size:18px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:60}
@media(max-width:520px){.top{flex-wrap:wrap}.btn{flex:1}}
</style></head><body>

<div class="bar"><div class="wrap"><div class="tabs" id="tabs"></div><div class="prog"><i id="pi"></i></div><div class="pt"><span id="p1"></span><span id="p2"></span></div></div></div>
<main class="wrap" id="main"></main>
<div class="foot"><div class="in"><div class="stat" id="stat"></div><button class="btn w" id="bcsv">⬇ ملف</button><button class="btn g" id="bcopy">📋 نسخ</button><button class="btn" id="bwa">📤 أرسل النتيجة</button></div></div>
<div class="toast" id="toast"></div><canvas id="cf"></canvas>
<script>
const FILES=[{"id": "vowel-patterns", "ar": "أنماط الحروف المتحركة", "en": "Long & Short Vowel Patterns", "pages": 4, "tab": "preschool"}, {"id": "alphabet-exercises", "ar": "الحروف الأبجدية: تمارين عامة", "en": "The Alphabet · Exercises", "pages": 53, "tab": "preschool"}, {"id": "about-yourself-family", "ar": "تأسيس: عن نفسك والأسرة", "en": "About Yourself & Family", "pages": 35, "tab": "preschool"}, {"id": "farm-food", "ar": "تأسيس: مفردات وجمل المزرعة والطعام", "en": "Farm & Food · Vocabulary", "pages": 33, "tab": "preschool"}, {"id": "alphabet-workbook", "ar": "دفتر الحروف الإنجليزية", "en": "Alphabet Workbook", "pages": 26, "tab": "preschool"}, {"id": "cvc-dictionary", "ar": "قاموس كلمات CVC", "en": "CVC Words Dictionary", "pages": 43, "tab": "preschool"}, {"id": "letter-sounds-dictionary", "ar": "قاموس نطق الحروف الإنجليزية", "en": "English Letter Sounds Dictionary", "pages": 41, "tab": "preschool"}, {"id": "short-sentences", "ar": "قراءة الجمل القصيرة", "en": "Short Sentences Reading", "pages": 22, "tab": "preschool"}, {"id": "phonics-stories", "ar": "قراءة وتأسيس صوتي: قصص الحروف", "en": "Phonics Reading Stories", "pages": 48, "tab": "preschool"}, {"id": "sight-words", "ar": "كلمات النظر Sight Words", "en": "Sight Words", "pages": 112, "tab": "preschool"}, {"id": "my-body", "ar": "كورس تأسيس: جسمي", "en": "My Body · Foundation", "pages": 83, "tab": "preschool"}, {"id": "animals-vocab", "ar": "كورس مفردات وقراءة: الحيوانات", "en": "Vocabulary & Reading · Animals", "pages": 79, "tab": "preschool"}, {"id": "topic-vocabulary", "ar": "مفردات الموضوعات المصورة", "en": "Picture Topic Vocabulary", "pages": 53, "tab": "preschool"}, {"id": "parts-of-speech", "ar": "أجزاء الكلام", "en": "Parts of Speech", "pages": 9, "tab": "primary"}, {"id": "adjectives", "ar": "الصفات", "en": "Adjectives", "pages": 85, "tab": "primary"}, {"id": "to-be-to-have", "ar": "الفعلان To Be و To Have", "en": "To Be & To Have", "pages": 34, "tab": "primary"}, {"id": "prepositions", "ar": "حروف الجر", "en": "Prepositions", "pages": 21, "tab": "primary"}, {"id": "reading-passages", "ar": "قطع القراءة والفهم", "en": "Reading Comprehension", "pages": 69, "tab": "primary"}, {"id": "writing-simple-sentences", "ar": "كورس الكتابة: الجمل البسيطة", "en": "Writing Course · Simple Sentences", "pages": 58, "tab": "primary"}, {"id": "primary-foundation-course", "ar": "كورس تأسيس للمرحلة الابتدائية", "en": "Primary Foundation Course", "pages": 103, "tab": "primary"}, {"id": "primary-grades-5-6", "ar": "كورس خامس وسادس ابتدائي", "en": "Primary Grades 5 & 6", "pages": 69, "tab": "primary"}, {"id": "have-got", "ar": "كورس قواعد: have got و has got", "en": "Have Got / Has Got", "pages": 127, "tab": "primary"}, {"id": "body-parts-articles", "ar": "كورس قواعد: أجزاء الجسم وأدوات النكرة", "en": "Body Parts & Articles", "pages": 155, "tab": "primary"}, {"id": "indefinite-articles", "ar": "كورس قواعد: أدوات النكرة", "en": "Indefinite Articles", "pages": 127, "tab": "primary"}, {"id": "irregular-verbs", "ar": "الأفعال الشاذة", "en": "Irregular Verbs", "pages": 9, "tab": "intermediate"}, {"id": "dialogues-questions", "ar": "المحادثات: كيف تكوّن السؤال", "en": "Dialogues · Making Questions", "pages": 21, "tab": "intermediate"}, {"id": "present-simple-continuous", "ar": "المضارع البسيط والمستمر", "en": "Present Simple vs Continuous", "pages": 59, "tab": "intermediate"}, {"id": "tenses-intro", "ar": "تمهيد: التعامل مع الأزمنة", "en": "Getting Ready for Tenses", "pages": 11, "tab": "intermediate"}, {"id": "translation-course", "ar": "كورس الترجمة", "en": "Translation Course", "pages": 83, "tab": "intermediate"}, {"id": "grammar-intermediate-secondary", "ar": "كورس قواعد لطلاب متوسط وثانوي", "en": "Grammar Course · Intermediate & Secondary", "pages": 104, "tab": "intermediate"}, {"id": "grammar-present-simple-course", "ar": "كورس قواعد: المضارع البسيط", "en": "Grammar Course · Present Simple", "pages": 121, "tab": "intermediate"}, {"id": "present-simple-summary", "ar": "ملخص القواعد: المضارع البسيط", "en": "Present Simple Summary", "pages": 17, "tab": "intermediate"}, {"id": "adults-foundation", "ar": "التأسيس للكبار", "en": "Foundation for Adults", "pages": 130, "tab": "secondary"}, {"id": "translation-part-8", "ar": "الترجمة: الجزء الثامن", "en": "Translation · Part Eight", "pages": 60, "tab": "secondary"}, {"id": "american-t", "ar": "اللهجة الأمريكية: نطق حرف T", "en": "American T", "pages": 6, "tab": "secondary"}, {"id": "prefixes-suffixes", "ar": "اللواحق والسوابق", "en": "Prefixes & Suffixes", "pages": 24, "tab": "secondary"}, {"id": "adults-linking-sounds", "ar": "صوتيات كبار: ربط الأصوات", "en": "Linking Sounds for Adults", "pages": 8, "tab": "secondary"}, {"id": "grammar-tenses", "ar": "كورس القواعد: الأزمنة", "en": "Grammar · Tenses", "pages": 126, "tab": "secondary"}];
const TABS=[['preschool','ما قبل المدرسة','🐣','#FFC9A8','#F26B4E'],['primary','المرحلة الابتدائية','🎒','#A9D4FF','#2F8BE0'],['intermediate','المرحلة المتوسطة','🚀','#D9C2F5','#8B5CC8'],['secondary','الثانوية والكبار','🎓','#8FE3B5','#1FA571'],['sum','الملخص','📊','#FFE9A8','#D4A72C']];
const QUICK=[10,15,20,25,30,40,50,75,100];
const KEY='anglomania.pricing.v1';let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let cur='preschool';
const isDone=f=>{const s=S[f.id];return s&&(s.t==='free'||(s.t==='paid'&&s.p>0))};
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function tabs(){$('#tabs').innerHTML=TABS.map(t=>{const fs=t[0]==='sum'?[]:FILES.filter(f=>f.tab===t[0]);const d=fs.filter(isDone).length;return `<button class="tab ${cur===t[0]?'on':''} ${fs.length&&d===fs.length?'done':''}" data-t="${t[0]}"><span class="o" style="--a:${t[3]};--b:${t[4]}">${t[2]}</span><span>${t[1]}<small>${t[0]==='sum'?'':N(d)+'/'+N(fs.length)}</small></span></button>`}).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=b.dataset.t;render();scrollTo({top:0,behavior:'smooth'})})}
function card(f,i){const s=S[f.id]||{};const c=s.t==='free'?'free':s.t==='paid'?'paid':'';
return `<div class="card ${c}" data-id="${f.id}"><div class="top"><div class="num">${N(i+1)}</div><div class="t"><b>${esc(f.ar)}</b><span>${esc(f.en)}</span><em>${N(f.pages)} صفحة</em></div></div>
<div class="ch"><div class="sw"><button class="f ${s.t==='free'?'on':''}" data-a="free">✨ مجاني</button><button class="p ${s.t==='paid'?'on':''}" data-a="paid">💎 مدفوع</button></div>
<div class="pr"><div class="q">${QUICK.map(q=>`<button data-q="${q}" class="${s.p===q?'on':''}">${N(q)}</button>`).join('')}</div><label>أو اكتب السعر:</label><input type="number" inputmode="numeric" min="1" max="9999" placeholder="0" value="${s.p||''}" data-i="1"><label>ريال</label></div></div></div>`}
function stats(){const t=FILES.length,d=FILES.filter(isDone).length;const fr=FILES.filter(f=>S[f.id]&&S[f.id].t==='free').length,pd=FILES.filter(f=>S[f.id]&&S[f.id].t==='paid').length;
$('#pi').style.width=d/t*100+'%';$('#p1').textContent='تم تحديد '+N(d)+' من '+N(t);$('#p2').textContent=N(Math.round(d/t*100))+'٪';
$('#stat').innerHTML=`${N(d)}/${N(t)} ملف<small>مجاني ${N(fr)} · مدفوع ${N(pd)}</small>`;return {t,d,fr,pd}}
function render(){tabs();const m=$('#main');
 if(cur==='sum'){const st=stats();const rows=TABS.slice(0,4).map(t=>{const fs=FILES.filter(f=>f.tab===t[0]);const fr=fs.filter(f=>(S[f.id]||{}).t==='free').length,pd=fs.filter(f=>(S[f.id]||{}).t==='paid');return `<tr><td>${t[2]} ${t[1]}</td><td>${N(fs.length)}</td><td>${N(fr)}</td><td>${N(pd.length)}</td><td>${N(pd.reduce((a,f)=>a+S[f.id].p,0))}</td></tr>`}).join('');
  const left=FILES.filter(f=>!isDone(f));
  m.innerHTML=`<section class="sec on"><div class="sh"><div class="o tab" style="--a:#FFE9A8;--b:#D4A72C;padding:0;border:0;width:54px;height:54px;justify-content:center"><span class="o" style="--a:#FFE9A8;--b:#D4A72C;width:54px;height:54px;font-size:28px">📊</span></div><div><h2>الملخص</h2><p>راجع قبل الإرسال</p></div></div><div class="sum"><table><tr><th>القسم</th><th>الملفات</th><th>مجاني</th><th>مدفوع</th><th>مجموع الأسعار (ريال)</th></tr>${rows}</table></div>
  ${left.length?`<div class="sum"><b style="color:var(--em2)">ملفات لم تُحدَّد بعد (${N(left.length)}):</b><div style="margin-top:6px;font-weight:700;font-size:14px;color:var(--muted)">${left.map(f=>esc(f.ar)).join(' · ')}</div></div>`:`<div class="done" style="display:block">🎉 أحسنت! حُدِّدت كل الملفات، اضغط «أرسل النتيجة»</div>`}</section>`;return}
 const t=TABS.find(x=>x[0]===cur);const fs=FILES.filter(f=>f.tab===cur);
 m.innerHTML=`<section class="sec on"><div class="sh"><span class="tab" style="padding:0;border:0"><span class="o" style="--a:${t[3]};--b:${t[4]};width:54px;height:54px;font-size:28px">${t[2]}</span></span><div><h2>${t[1]}</h2><p>${N(fs.length)} ملفاً في هذا القسم</p></div></div>
 <div class="bulk"><button class="mini" data-b="free">✨ اجعل الكل مجانياً</button><button class="mini" data-b="clear">↺ مسح الاختيار</button></div>${fs.map(card).join('')}</section>`;
 m.querySelectorAll('.card').forEach(c=>{const id=c.dataset.id;
  c.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const s=S[id]=S[id]||{};s.t=b.dataset.a;if(s.t==='free')delete s.p;save();upd(c,id)});
  c.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const s=S[id]=S[id]||{t:'paid'};s.t='paid';s.p=+b.dataset.q;save();upd(c,id)});
  const inp=c.querySelector('input');inp.oninput=()=>{const s=S[id]=S[id]||{t:'paid'};s.t='paid';s.p=Math.max(0,Math.min(9999,parseInt(inp.value)||0));save();stats();tabs();c.querySelectorAll('[data-q]').forEach(b=>b.classList.toggle('on',+b.dataset.q===s.p))}});
 m.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{fs.forEach(f=>{if(b.dataset.b==='free')S[f.id]={t:'free'};else delete S[f.id]});save();render()});
 stats();checkDone()}
function upd(c,id){const f=FILES.find(x=>x.id===id);const i=[...c.parentNode.querySelectorAll('.card')].indexOf(c);c.outerHTML=card(f,i);const n=document.querySelector(`.card[data-id="${id}"]`);n.parentNode&&render0(n,id);stats();tabs();checkDone()}
function render0(n,id){const c=n;c.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const s=S[id]=S[id]||{};s.t=b.dataset.a;if(s.t==='free')delete s.p;save();upd(c,id)});c.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const s=S[id]=S[id]||{t:'paid'};s.t='paid';s.p=+b.dataset.q;save();upd(c,id)});const inp=c.querySelector('input');inp.oninput=()=>{const s=S[id]=S[id]||{t:'paid'};s.t='paid';s.p=Math.max(0,Math.min(9999,parseInt(inp.value)||0));save();stats();tabs();c.querySelectorAll('[data-q]').forEach(b=>b.classList.toggle('on',+b.dataset.q===s.p))}}
let celebrated=false;function checkDone(){const all=FILES.every(isDone);if(all&&!celebrated){celebrated=true;confetti();toast('🎉 أحسنت! حُدِّدت كل الملفات')}if(!all)celebrated=false}
function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#D4A72C','#1FA571','#F26B4E','#2F8BE0','#8B5CC8','#FFD966'];const p=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,c:cols[Math.random()*6|0]}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.r+=.15;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);x.restore()});if(++f<160)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
function report(){const L=['تسعير ملفات ركن التأسيس · Anglomania',''];TABS.slice(0,4).forEach(t=>{L.push('▪ '+t[1]);FILES.filter(f=>f.tab===t[0]).forEach((f,i)=>{const s=S[f.id]||{};L.push(`${i+1}. ${f.ar} | ${f.en} | ${s.t==='free'?'مجاني':s.t==='paid'?'مدفوع '+(s.p||'؟')+' ريال':'لم يُحدَّد'}`)});L.push('')});const st=stats();L.push(`المحدد: ${st.d}/${st.t} · مجاني ${st.fr} · مدفوع ${st.pd}`);return L.join('\n')}
function csv(){const r=[['القسم','الملف','English','الصفحات','النوع','السعر بالريال']];TABS.slice(0,4).forEach(t=>FILES.filter(f=>f.tab===t[0]).forEach(f=>{const s=S[f.id]||{};r.push([t[1],f.ar,f.en,f.pages,s.t==='free'?'مجاني':s.t==='paid'?'مدفوع':'',s.p||''])}));return '﻿'+r.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')}
$('#bcopy').onclick=()=>{const t=report();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('تم نسخ النتيجة'),()=>toast('تعذّر النسخ'))};
$('#bwa').onclick=()=>{const left=FILES.filter(f=>!isDone(f)).length;if(left&&!confirm('بقي '+left+' ملفاً لم يُحدَّد. هل تريد الإرسال؟'))return;open('https://wa.me/?text='+encodeURIComponent(report()),'_blank')};
$('#bcsv').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv()],{type:'text/csv;charset=utf-8'}));a.download='anglomania-pricing.csv';a.click()};
render();
</script></body></html>
