<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E5E3E">
<meta name="robots" content="noindex">
<title>ركن التأسيس · Anglomania</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--em:#0E5E3E;--em2:#0A4530;--em3:#1FA571;--emL:#E4F0E8;--gold:#D4A72C;--goldD:#9E7E22;--goldL:#FFD966;--goldS:#F6EBC8;--cream:#FBF7EA;--ivory:#FEFDF5;--ink:#17302A;--muted:#5B6C65;--coral:#F26B4E;--sky:#2F8BE0;--violet:#8B5CC8;--r:20px;--font:'Cairo',"Segoe UI",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);background:var(--ivory);min-height:100vh;overflow-x:hidden;line-height:1.6}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(1200px 600px at 50% -10%,#DFF3E7 0%,rgba(254,253,245,0) 60%),radial-gradient(900px 500px at 50% 110%,#FBEFC4 0%,rgba(254,253,245,0) 60%),linear-gradient(180deg,#FFFFFA,#FBF7EA)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(254,253,245,.86);backdrop-filter:blur(10px);border-bottom:1px solid rgba(212,167,44,.35)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;color:var(--em2)}
.brand img{width:36px;height:36px;border-radius:11px;border:1.5px solid var(--gold);background:#fff;padding:2px}
.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--goldD);font-weight:800;margin-top:-6px;direction:ltr;text-align:start}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;font-weight:800;font-size:14px;background:#fff;border:1.5px solid var(--gold);color:var(--em2);box-shadow:0 2px 0 var(--goldD)}
.pill:active{transform:translateY(2px);box-shadow:none}
.pill.solid{background:linear-gradient(180deg,var(--em3),var(--em));color:#FFF3C8;border-color:var(--goldD)}
/* hero */
.hero{position:relative;text-align:center;padding:34px 0 18px}
.hero img.lg{width:min(250px,60vw);filter:drop-shadow(0 12px 18px rgba(14,94,62,.22));animation:bob 5s ease-in-out infinite}
.tag{display:flex;align-items:center;justify-content:center;gap:12px;direction:ltr;margin-top:2px;font-weight:900;letter-spacing:3px;font-size:12px;color:var(--em)}
.tag:before,.tag:after{content:"";width:46px;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}.tag:after{transform:scaleX(-1)}
.hero h1{font-size:clamp(36px,8vw,64px);font-weight:900;color:var(--em);line-height:1.15;margin-top:12px}
.hero h1 em{font-style:normal;color:var(--gold);text-shadow:0 2px 0 rgba(158,126,34,.25)}
.hero .en{font-weight:800;color:var(--goldD);direction:ltr;letter-spacing:1px;font-size:clamp(16px,3.2vw,22px)}
.hero p{max-width:560px;margin:12px auto 0;color:var(--muted);font-weight:600}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:16px;font-weight:900;font-size:16px;background:linear-gradient(180deg,var(--em3),var(--em));color:#FFF3C8;border:2px solid var(--goldD);box-shadow:0 4px 0 var(--em2),0 10px 18px -8px rgba(14,94,62,.5);transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--em2)}
.btn.gold{background:linear-gradient(180deg,#FFE184,var(--gold));color:#4a3a05;border-color:var(--goldD);box-shadow:0 4px 0 var(--goldD),0 10px 18px -8px rgba(158,126,34,.6)}
.btn.ghost{background:#fff;color:var(--em2);box-shadow:0 4px 0 var(--goldD)}
.fl{position:absolute;font-weight:900;color:transparent;-webkit-text-stroke:1.5px rgba(212,167,44,.55);font-size:clamp(44px,9vw,86px);direction:ltr;pointer-events:none;animation:flt 7s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0) rotate(var(--r0,0deg))}50%{transform:translateY(-16px) rotate(calc(var(--r0,0deg) + 6deg))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* journey */
.jr{position:relative;margin:26px 0 10px;padding:10px 0}
.jr h2.h{text-align:center;font-size:26px;font-weight:900;color:var(--em2);margin-bottom:4px}
.jr .sub{text-align:center;color:var(--muted);font-weight:600;margin-bottom:22px}
.path{position:relative;display:grid;gap:26px;max-width:760px;margin-inline:auto}
.path:before{content:"";position:absolute;top:0;bottom:0;right:44px;width:6px;border-radius:6px;background:repeating-linear-gradient(180deg,var(--gold) 0 14px,transparent 14px 26px);opacity:.55}
.path .fill{position:absolute;top:0;right:44px;width:6px;border-radius:6px;background:linear-gradient(180deg,var(--em3),var(--em));height:var(--p,0%);transition:height .2s}
.st{position:relative;display:flex;gap:16px;align-items:center;padding-inline-end:0;opacity:0;transform:translateY(24px);transition:.6s cubic-bezier(.2,.8,.2,1)}
.st.in{opacity:1;transform:none}
.orb{flex:none;width:92px;height:92px;border-radius:50%;position:relative;display:grid;place-items:center;font-size:42px;z-index:2;background:radial-gradient(circle at 32% 28%,var(--o1),var(--o2) 65%,var(--o3));box-shadow:inset 0 -8px 14px rgba(0,0,0,.18),inset 0 6px 10px rgba(255,255,255,.35),0 12px 20px -8px var(--o3),0 0 0 4px #fff,0 0 0 7px var(--gold);animation:bob 4.5s ease-in-out infinite}
.orb:before{content:"";position:absolute;top:9%;left:16%;width:40%;height:26%;border-radius:50%;background:rgba(255,255,255,.6);filter:blur(1px);transform:rotate(-24deg)}
.orb span{position:relative;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.orb.sm{width:70px;height:70px;font-size:32px}
.card{flex:1;background:#fff;border:2px solid var(--gold);border-radius:var(--r);padding:16px 18px;box-shadow:0 5px 0 var(--goldD),0 16px 28px -16px rgba(14,94,62,.4);position:relative;transition:transform .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px)}
.card .n{font-size:12px;font-weight:900;letter-spacing:2px;color:var(--goldD);direction:ltr;text-align:start}
.card h3{font-size:22px;font-weight:900;color:var(--em2);line-height:1.3}
.card h3 small{display:block;font-size:13px;font-weight:800;color:var(--goldD);direction:ltr;text-align:start;letter-spacing:.3px}
.card p{color:var(--muted);font-weight:600;font-size:14px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--emL);color:var(--em2)}
.chip.g{background:var(--goldS);color:#6b5410}
.card.lock{background:repeating-linear-gradient(135deg,#fff 0 12px,#FBF7EA 12px 24px);border-style:dashed}
.rib{position:absolute;top:-11px;inset-inline-start:16px;background:linear-gradient(180deg,#FFE184,var(--gold));color:#4a3a05;font-weight:900;font-size:12px;padding:2px 12px;border-radius:99px;border:1.5px solid var(--goldD)}
/* stage page */
.crumb{display:flex;gap:8px;align-items:center;margin:16px 0 4px;font-weight:800;color:var(--goldD);font-size:14px;flex-wrap:wrap}
.crumb a{color:var(--em)}.crumb a:hover{text-decoration:underline}
.sh{display:flex;gap:18px;align-items:center;margin:8px 0 18px}
.sh h1{font-size:clamp(28px,6vw,42px);font-weight:900;color:var(--em2);line-height:1.2}
.sh h1 small{display:block;font-size:16px;color:var(--goldD);direction:ltr;text-align:start;letter-spacing:.5px}
.sh p{color:var(--muted);font-weight:600}
.test{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#FFF3C4,#FFE184);border:2px solid var(--goldD);border-radius:var(--r);padding:16px 18px;box-shadow:0 5px 0 var(--goldD);margin:8px 0 22px;position:relative;overflow:hidden}
.test:after{content:"★";position:absolute;inset-inline-end:-6px;top:-24px;font-size:120px;color:rgba(255,255,255,.4);transform:rotate(14deg)}
.test .ic{font-size:44px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.test h3{font-size:20px;font-weight:900;color:#4a3a05;line-height:1.3}.test p{font-weight:700;color:#6b5410;font-size:14px}
.test .btn{margin-inline-start:auto;flex:none;position:relative;z-index:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tile{position:relative;border-radius:22px;padding:18px;background:#fff;border:2px solid var(--gold);box-shadow:0 5px 0 var(--goldD),0 16px 28px -16px rgba(14,94,62,.4);display:flex;flex-direction:column;gap:6px;min-height:170px;transition:transform .15s;overflow:hidden}
a.tile:hover{transform:translateY(-4px) rotate(-.4deg)}
.tile:before{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--o1),transparent 70%);opacity:.28}
.tile h3{font-size:21px;font-weight:900;color:var(--em2);line-height:1.2}
.tile h3 small{display:block;font-size:13px;color:var(--goldD);direction:ltr;text-align:start}
.tile .cnt{margin-top:auto;font-weight:800;color:var(--muted);font-size:13px}
.tile.empty{opacity:.85;border-style:dashed;box-shadow:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 18px}
.tools input{flex:1;min-width:200px;padding:12px 16px;border-radius:16px;border:2px solid var(--gold);background:#fff;font:inherit;font-weight:700;color:var(--ink);box-shadow:0 3px 0 var(--goldD)}
.seg{display:flex;border:2px solid var(--gold);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 3px 0 var(--goldD)}
.seg button{padding:10px 16px;font-weight:900;color:var(--em2)}.seg button.on{background:linear-gradient(180deg,var(--em3),var(--em));color:#FFF3C8}
.h2{font-weight:900;color:var(--em2);margin:6px 0 12px}
.secs{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.sec{min-height:230px;gap:8px}.sec .n{font-size:12px;font-weight:900;letter-spacing:2px;color:var(--goldD)}.sec .sd{color:var(--muted);font-weight:600;font-size:14px}
.tr{position:absolute;top:12px;inset-inline-start:12px;z-index:2;font-size:12px;font-weight:900;padding:3px 11px;border-radius:99px;border:1.5px solid var(--goldD)}
.tr.f{background:#DDF3E6;color:var(--em2)}.tr.p{background:linear-gradient(180deg,#FFE184,var(--gold));color:#4a3a05}
/* books */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.bk{background:#fff;border:2px solid var(--gold);border-radius:20px;overflow:hidden;box-shadow:0 5px 0 var(--goldD),0 16px 28px -16px rgba(14,94,62,.4);display:flex;flex-direction:column}
.cov{position:relative;aspect-ratio:1/.86;background:linear-gradient(180deg,#FFFFFA,#F8F0CF);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;border-bottom:2px solid var(--goldS)}
.cov:before{content:"";position:absolute;inset:8px;border:1.5px solid var(--gold);border-radius:14px}
.cov img{width:92px;position:relative}
.cov b{position:relative;font-weight:900;color:var(--em);font-size:15px;line-height:1.3;direction:ltr}
.cov i{position:relative;font-style:normal;font-weight:900;color:var(--gold);font-size:14px}
.bk .in{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.bk h4{font-size:16px;font-weight:900;color:var(--em2);line-height:1.35}
.bk .meta{font-size:12px;font-weight:800;color:var(--muted)}
.bk .act{display:flex;gap:8px;margin-top:auto}
.bk .act .btn{flex:1;padding:9px 10px;font-size:14px;border-radius:13px}
/* modal viewer */
.mod{position:fixed;inset:0;z-index:60;background:rgba(10,40,28,.72);display:none;align-items:center;justify-content:center;padding:14px}
.mod.on{display:flex}
.mb{width:min(1000px,100%);height:min(92vh,100%);background:#fff;border-radius:20px;border:3px solid var(--gold);display:flex;flex-direction:column;overflow:hidden}
.mb header{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--cream);border-bottom:2px solid var(--goldS)}
.mb header b{font-weight:900;color:var(--em2);flex:1;font-size:15px}
.mb iframe{flex:1;border:0;width:100%}
/* quiz */
.qz{max-width:720px;margin:14px auto 40px}
.qbar{display:flex;align-items:center;gap:10px;margin:10px 0 16px}
.qbar .trk{flex:1;height:14px;background:var(--goldS);border-radius:99px;overflow:hidden;border:1.5px solid var(--gold)}
.qbar .trk i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--em3),var(--em));border-radius:99px;transition:width .4s}
.qbar span{font-weight:900;color:var(--goldD);font-size:14px;direction:ltr}
.qc{background:#fff;border:2px solid var(--gold);border-radius:24px;padding:22px;box-shadow:0 6px 0 var(--goldD),0 20px 34px -20px rgba(14,94,62,.5)}
.qc .cn{display:inline-block;font-size:12px;font-weight:900;letter-spacing:1px;background:var(--emL);color:var(--em2);padding:3px 12px;border-radius:99px}
.qc .q{font-size:clamp(20px,4.6vw,26px);font-weight:800;margin:12px 0 4px;line-height:1.5;white-space:pre-line}
.qc .qa{color:var(--muted);font-weight:700;font-size:14px;margin-bottom:12px}
.say{display:inline-flex;align-items:center;gap:8px;margin:4px 0 8px;padding:10px 18px;border-radius:99px;background:linear-gradient(180deg,#FFE184,var(--gold));border:2px solid var(--goldD);font-weight:900;color:#4a3a05;box-shadow:0 3px 0 var(--goldD)}
.opts{display:grid;gap:10px;margin-top:10px}
.op{display:flex;width:100%;align-items:center;gap:12px;text-align:start;padding:13px 16px;border-radius:16px;background:var(--ivory);border:2px solid var(--goldS);font-weight:800;font-size:18px;transition:.15s}
.op:hover{border-color:var(--gold);transform:translateX(-3px)}
.op:before{content:attr(data-l);flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--goldS);color:var(--goldD);font-size:14px;font-weight:900;direction:ltr}
.op.ok{background:#DDF3E6;border-color:var(--em3);animation:pop .4s}.op.ok:before{background:var(--em3);color:#fff}
.op.no{background:#FDE5DF;border-color:var(--coral);animation:shk .4s}.op.no:before{background:var(--coral);color:#fff}
.op[disabled]{cursor:default}.op[disabled]:hover{transform:none}
@keyframes pop{50%{transform:scale(1.04)}}@keyframes shk{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700;display:none}
.fb.on{display:block}.fb.ok{background:#E9F7EE;color:#0A4530}.fb.no{background:#FFF0EC;color:#7a2a18}
.nx{margin-top:14px;display:none;justify-content:flex-end}.nx.on{display:flex}
.res{text-align:center}
.ring{--v:0;width:190px;height:190px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(var(--em3) calc(var(--v)*1%),var(--goldS) 0);position:relative}
.ring:before{content:"";position:absolute;inset:14px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--gold)}
.ring b{position:relative;font-size:48px;font-weight:900;color:var(--em2);direction:ltr}
.lv{font-size:30px;font-weight:900;color:var(--em2)}
.bars{display:grid;gap:10px;margin:18px 0;text-align:start}
.bar{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;font-weight:800;font-size:14px}
.bar .t{height:14px;border-radius:99px;background:var(--goldS);overflow:hidden;border:1.5px solid var(--gold)}
.bar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--em3),var(--em));border-radius:99px;width:0;transition:width 1s .2s}
.bar .t.w i{background:linear-gradient(90deg,#FFB38A,var(--coral))}
.rec{background:var(--cream);border:2px dashed var(--gold);border-radius:18px;padding:14px;margin:10px 0;text-align:start}
.rec h4{font-weight:900;color:var(--em2)}
.rec a{display:block;padding:8px 0;font-weight:800;color:var(--em);border-bottom:1px solid var(--goldS)}
.rec a:last-child{border:0}
canvas.cf{position:fixed;inset:0;pointer-events:none;z-index:70}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--em2);color:#FFF3C8;padding:10px 20px;border-radius:99px;font-weight:800;z-index:80;display:none}
.foot{text-align:center;padding:30px 0 40px;color:var(--goldD);font-weight:800;font-size:13px}
.foot b{color:var(--em2)}
@media(max-width:560px){.orb{width:76px;height:76px;font-size:34px}.path:before,.path .fill{right:35px}.test{flex-wrap:wrap}.test .btn{width:100%;margin:0}.bar{grid-template-columns:86px 1fr 40px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.st{opacity:1;transform:none}}
</style>
</head>

const PLACEMENT={"preschool": [{"id": "pre01", "corner": "letters", "lvl": 1, "q": "Which one is the capital letter A?", "qa": "أي حرف هو الحرف الكبير A؟", "opts": ["a", "A", "B", "b"], "a": 1, "why": "الحرف الكبير هو A.", "whyEn": "The capital letter is A."}, {"id": "pre02", "corner": "letters", "lvl": 1, "q": "Which small letter matches M?", "qa": "أي حرف صغير يناسب الحرف M؟", "opts": ["n", "w", "h", "m"], "a": 3, "why": "الحرف الصغير للحرف M هو m.", "whyEn": "The small letter for M is m."}, {"id": "pre03", "corner": "letters", "lvl": 2, "q": "A  B  C  ...  What comes next?", "qa": "أي حرف يأتي بعد C؟", "opts": ["E", "D", "F", "G"], "a": 1, "why": "الترتيب هو A B C D.", "whyEn": "The order is A B C D."}, {"id": "pre04", "corner": "letters", "lvl": 2, "q": "Which small letter matches D?", "qa": "أي حرف صغير يناسب الحرف D؟", "opts": ["b", "p", "q", "d"], "a": 3, "why": "الحرف الصغير للحرف D هو d.", "whyEn": "The small letter for D is d."}, {"id": "pre05", "corner": "letters", "lvl": 3, "q": "g  _  i   Which letter is missing?", "qa": "أي حرف ناقص بين g و i؟", "opts": ["f", "j", "h", "k"], "a": 2, "why": "الترتيب هو g h i.", "whyEn": "The order is g h i."}, {"id": "pre06", "corner": "phonics", "lvl": 1, "q": "Which letter does the word start with?", "qa": "بأي حرف تبدأ الكلمة؟", "say": "cat", "opts": ["b", "c", "m", "s"], "a": 1, "why": "كلمة cat تبدأ بالحرف c.", "whyEn": "The word cat starts with c."}, {"id": "pre07", "corner": "phonics", "lvl": 1, "q": "Which letter does the word start with?", "qa": "بأي حرف تبدأ الكلمة؟", "say": "sun", "opts": ["t", "n", "s", "p"], "a": 2, "why": "كلمة sun تبدأ بالحرف s.", "whyEn": "The word sun starts with s."}, {"id": "pre08", "corner": "phonics", "lvl": 2, "q": "Which word has the sounds b - e - d?", "qa": "أي كلمة فيها الأصوات b - e - d؟", "opts": ["bad", "bid", "bud", "bed"], "a": 3, "why": "الأصوات b و e و d تكوّن كلمة bed.", "whyEn": "b, e and d make the word bed."}, {"id": "pre09", "corner": "phonics", "lvl": 2, "q": "Which word rhymes with cat?", "qa": "أي كلمة تنتهي بنفس صوت كلمة cat؟", "opts": ["dog", "hat", "sun", "pen"], "a": 1, "why": "كلمتا cat و hat تنتهيان بنفس الصوت.", "whyEn": "Cat and hat end with the same sound."}, {"id": "pre10", "corner": "phonics", "lvl": 3, "q": "Which word rhymes with pen?", "qa": "أي كلمة تنتهي بنفس صوت كلمة pen؟", "opts": ["pan", "pin", "hen", "pot"], "a": 2, "why": "كلمتا pen و hen تنتهيان بنفس الصوت.", "whyEn": "Pen and hen end with the same sound."}, {"id": "pre11", "corner": "grammar", "lvl": 1, "q": "🔴  What colour is this?", "qa": "ما لون هذه الدائرة؟", "opts": ["blue", "green", "yellow", "red"], "a": 3, "why": "الدائرة حمراء، أي red.", "whyEn": "The circle is red."}, {"id": "pre12", "corner": "grammar", "lvl": 1, "q": "This is a ___.  🐶", "qa": "هذا ___.", "opts": ["cat", "dog", "cow", "hen"], "a": 1, "why": "الصورة كلب، أي dog.", "whyEn": "The picture is a dog."}, {"id": "pre13", "corner": "grammar", "lvl": 2, "q": "👁️  This is my ___.", "qa": "هذه ___ لي.", "opts": ["ear", "nose", "eye", "hand"], "a": 2, "why": "الصورة عين، أي eye.", "whyEn": "The picture is an eye."}, {"id": "pre14", "corner": "grammar", "lvl": 2, "q": "I ___ a boy.", "qa": "أنا ___ ولد.", "opts": ["am", "is", "are", "be"], "a": 0, "why": "نقول I am مع كلمة I.", "whyEn": "We say I am."}, {"id": "pre15", "corner": "grammar", "lvl": 3, "q": "The opposite of hot is ___.", "qa": "عكس hot هو ___.", "opts": ["big", "red", "cold", "sad"], "a": 2, "why": "عكس حار (hot) هو بارد (cold).", "whyEn": "The opposite of hot is cold."}, {"id": "pre16", "corner": "handwriting", "lvl": 1, "q": "Which is the capital form of b?", "qa": "أي حرف هو الشكل الكبير للحرف b؟", "opts": ["B", "D", "P", "R"], "a": 0, "why": "الشكل الكبير للحرف b هو B.", "whyEn": "The capital form of b is B."}, {"id": "pre17", "corner": "handwriting", "lvl": 1, "q": "Which one is a capital letter?", "qa": "أي حرف هو حرف كبير؟", "opts": ["g", "k", "m", "T"], "a": 3, "why": "الحرف T هو الحرف الكبير.", "whyEn": "T is the capital letter."}, {"id": "pre18", "corner": "handwriting", "lvl": 2, "q": "Which is the correct order of letters?   🐱", "qa": "ما الترتيب الصحيح لحروف الكلمة؟", "opts": ["c-t-a", "a-c-t", "c-a-t", "t-c-a"], "a": 2, "why": "حروف كلمة القطة هي c ثم a ثم t.", "whyEn": "The letters of cat are c, then a, then t."}, {"id": "pre19", "corner": "handwriting", "lvl": 2, "q": "To write the letter L, we go down and then ___.", "qa": "لكتابة الحرف L ننزل ثم نكتب نحو ___.", "opts": ["right", "left", "up", "round"], "a": 0, "why": "نكتب الحرف L بخط للأسفل ثم خط نحو اليمين.", "whyEn": "L is a line down and then a line to the right."}, {"id": "pre20", "corner": "handwriting", "lvl": 3, "q": "Which is the correct order of letters?   🐷", "qa": "ما الترتيب الصحيح لحروف الكلمة؟", "opts": ["p-g-i", "i-p-g", "g-i-p", "p-i-g"], "a": 3, "why": "حروف كلمة pig هي p ثم i ثم g.", "whyEn": "The letters of pig are p, then i, then g."}], "primary": [{"id": "pri01", "corner": "translation", "lvl": 1, "q": "What does \"apple\" mean?", "qa": "ما معنى كلمة apple؟", "opts": ["تفاحة", "موزة", "برتقالة", "عنب"], "a": 0, "why": "كلمة apple تعني تفاحة.", "whyEn": "Apple means تفاحة."}, {"id": "pri02", "corner": "translation", "lvl": 1, "q": "What does \"book\" mean?", "qa": "ما معنى كلمة book؟", "opts": ["قلم", "كتاب", "باب", "طاولة"], "a": 1, "why": "كلمة book تعني كتاب.", "whyEn": "Book means كتاب."}, {"id": "pri03", "corner": "translation", "lvl": 2, "q": "Choose the best meaning:\nI like water.", "qa": "اختر المعنى الأنسب للجملة.", "opts": ["أنا أشرب الحليب", "هو يحب الماء", "أنا أحب الماء", "أنا أرى الماء"], "a": 2, "why": "الجملة تعني: أنا أحب الماء.", "whyEn": "The sentence means: I like water."}, {"id": "pri04", "corner": "translation", "lvl": 2, "q": "Choose the best English sentence:\nالمدرسة كبيرة", "qa": "اختر الجملة الإنجليزية المناسبة.", "opts": ["The school is small.", "The house is big.", "The book is big.", "The school is big."], "a": 3, "why": "المدرسة كبيرة تعني The school is big.", "whyEn": "المدرسة كبيرة is The school is big."}, {"id": "pri05", "corner": "translation", "lvl": 3, "q": "Choose the best meaning:\nShe is reading a book in the garden.", "qa": "اختر المعنى الأنسب للجملة.", "opts": ["هي تكتب كتابًا في الحديقة", "هي تقرأ كتابًا في الحديقة", "هو يقرأ كتابًا في البيت", "هي تقرأ كتابًا في المدرسة"], "a": 1, "why": "الجملة تعني: هي تقرأ كتابًا في الحديقة.", "whyEn": "She is reading a book in the garden."}, {"id": "pri06", "corner": "grammar", "lvl": 1, "q": "I ___ a student.", "qa": "أنا ___ طالب.", "opts": ["is", "are", "am", "be"], "a": 2, "why": "نقول I am مع كلمة I.", "whyEn": "We say I am."}, {"id": "pri07", "corner": "grammar", "lvl": 1, "q": "A fish ___ swim.", "qa": "السمكة ___ السباحة.", "opts": ["is", "can", "cans", "does"], "a": 1, "why": "نستخدم can بمعنى يستطيع، والفعل بعدها يبقى كما هو.", "whyEn": "Can means able to; it does not change."}, {"id": "pri08", "corner": "grammar", "lvl": 2, "q": "One box, two ___.", "qa": "صندوق واحد، صندوقان ___.", "opts": ["boxs", "boxies", "boxes", "box"], "a": 2, "why": "جمع box هو boxes.", "whyEn": "The plural of box is boxes."}, {"id": "pri09", "corner": "grammar", "lvl": 2, "q": "The ball is inside the box.\nIt is ___ the box.", "qa": "الكرة داخل الصندوق. هي ___ الصندوق.", "opts": ["on", "in", "under", "with"], "a": 1, "why": "نستخدم in بمعنى داخل.", "whyEn": "We use in for inside."}, {"id": "pri10", "corner": "grammar", "lvl": 3, "q": "My brother ___ football every day.", "qa": "أخي ___ كرة القدم كل يوم.", "opts": ["play", "playing", "plays", "are play"], "a": 2, "why": "مع he وshe وكلمة brother نضيف s للفعل: plays.", "whyEn": "With he, she or a singular noun, add s: plays."}, {"id": "pri11", "corner": "writing", "lvl": 1, "q": "Choose the correct sentence.", "qa": "اختر الجملة الصحيحة.", "opts": ["my name is Sara.", "My name is Sara", "my Name is sara", "My name is Sara."], "a": 3, "why": "الجملة تبدأ بحرف كبير وتنتهي بنقطة.", "whyEn": "A sentence starts with a capital letter and ends with a full stop."}, {"id": "pri12", "corner": "writing", "lvl": 1, "q": "Which word is spelled correctly?", "qa": "أي كلمة مكتوبة بشكل صحيح؟", "opts": ["frend", "freind", "friend", "friand"], "a": 2, "why": "التهجئة الصحيحة هي friend.", "whyEn": "The correct spelling is friend."}, {"id": "pri13", "corner": "writing", "lvl": 2, "q": "Choose the correct sentence.", "qa": "اختر الجملة الصحيحة.", "opts": ["She a red bag has.", "Red bag she has a.", "She has a red bag.", "Has a she red bag."], "a": 2, "why": "ترتيب الجملة الصحيح: الفاعل ثم الفعل ثم باقي الجملة.", "whyEn": "The correct order is subject, verb, then the rest."}, {"id": "pri14", "corner": "writing", "lvl": 2, "q": "Choose the correct question.", "qa": "اختر السؤال الصحيح.", "opts": ["where do you live", "Where do you live?", "where do you live?", "Where do you live."], "a": 1, "why": "السؤال يبدأ بحرف كبير وينتهي بعلامة استفهام.", "whyEn": "A question starts with a capital letter and ends with a question mark."}, {"id": "pri15", "corner": "writing", "lvl": 3, "q": "Choose the correct sentence.", "qa": "اختر الجملة الصحيحة.", "opts": ["She don't like milk.", "She not like milk.", "She doesn't likes milk.", "She doesn't like milk."], "a": 3, "why": "بعد doesn't يبقى الفعل كما هو: like.", "whyEn": "After doesn't, the verb stays the same: like."}, {"id": "pri16", "corner": "reading", "lvl": 1, "q": "Sara has a small cat.\nThe cat is white.\nWhat colour is the cat?", "qa": "ما لون القطة؟", "opts": ["Black", "White", "Brown", "Red"], "a": 1, "why": "النص يقول إن القطة بيضاء.", "whyEn": "The text says the cat is white."}, {"id": "pri17", "corner": "reading", "lvl": 1, "q": "It is Friday. Ali goes to the mosque with his father.\nWho does Ali go with?", "qa": "مع من يذهب علي؟", "opts": ["His mother", "His teacher", "His friend", "His father"], "a": 3, "why": "النص يقول إنه يذهب مع أبيه.", "whyEn": "The text says he goes with his father."}, {"id": "pri18", "corner": "reading", "lvl": 2, "q": "Lina gets up at six o'clock. She eats breakfast and goes to school. She comes home at two.\nWhen does Lina come home?", "qa": "متى تعود لينا إلى البيت؟", "opts": ["At six", "At seven", "At two", "At four"], "a": 2, "why": "النص يقول إنها تعود في الساعة الثانية.", "whyEn": "The text says she comes home at two."}, {"id": "pri19", "corner": "reading", "lvl": 2, "q": "We have a big garden. There are three trees and many flowers. My mother likes the red flowers.\nHow many trees are in the garden?", "qa": "كم شجرة في الحديقة؟", "opts": ["Two", "Four", "Many", "Three"], "a": 3, "why": "النص يقول إن فيها ثلاث أشجار.", "whyEn": "The text says there are three trees."}, {"id": "pri20", "corner": "reading", "lvl": 3, "q": "Omar is tired because he played football for two hours. Now he wants to drink water and sleep.\nWhy is Omar tired?", "qa": "لماذا عمر متعب؟", "opts": ["He read a book.", "He went to school.", "He played football for two hours.", "He drank water."], "a": 2, "why": "النص يقول إنه لعب كرة القدم ساعتين.", "whyEn": "The text says he played football for two hours."}], "intermediate": [{"id": "int01", "corner": "translation", "lvl": 1, "q": "Choose the best Arabic translation:\nMy brother goes to school by bus.", "qa": "اختر أفضل ترجمة عربية للجملة", "opts": ["أخي ذهب إلى المدرسة بالسيارة.", "أخي يذهب إلى المدرسة بالحافلة.", "أخي يعمل في المدرسة كل يوم.", "أخي يحب الحافلة المدرسية."], "a": 1, "why": "الجملة في المضارع البسيط وتعني أنه يذهب بالحافلة عادةً.", "whyEn": "The sentence is present simple and means he usually goes by bus."}, {"id": "int02", "corner": "translation", "lvl": 1, "q": "Choose the correct English translation:\nأنا أحب قراءة الكتب في المساء.", "qa": "اختر الترجمة الإنجليزية الصحيحة للجملة", "opts": ["I like reading books in the evening.", "I like read books at the evening.", "I likes reading books in the evening.", "I am like reading books in evening."], "a": 0, "why": "نقول I like + V-ing، ونستخدم in the evening للمساء.", "whyEn": "We say I like + verb-ing, and in the evening for evenings."}, {"id": "int03", "corner": "translation", "lvl": 2, "q": "Choose the best Arabic translation:\nShe has been studying English for two years.", "qa": "اختر أفضل ترجمة عربية للجملة", "opts": ["هي تدرس اللغة الإنجليزية منذ سنتين.", "هي لم تدرس اللغة الإنجليزية منذ سنتين.", "هي درست اللغة الإنجليزية قبل سنتين.", "هي ستدرس اللغة الإنجليزية لمدة سنتين."], "a": 0, "why": "المضارع التام المستمر يدل على فعل بدأ في الماضي وما زال مستمرًا.", "whyEn": "Present perfect continuous shows an action that started in the past and continues now."}, {"id": "int04", "corner": "translation", "lvl": 2, "q": "Choose the correct English translation:\nهل يمكنك مساعدتي في واجبي المنزلي؟", "qa": "اختر الترجمة الإنجليزية الصحيحة للجملة", "opts": ["Can you help me for my homework?", "Do you can help me with my homework?", "Can you help me with my homework?", "Can you helping me with my homework?"], "a": 2, "why": "بعد can نستخدم الفعل المجرد، ونقول help someone with something.", "whyEn": "After can we use the base verb, and we say help someone with something."}, {"id": "int05", "corner": "translation", "lvl": 3, "q": "Choose the best Arabic translation:\nWe must not be late for the exam.", "qa": "اختر أفضل ترجمة عربية للجملة", "opts": ["ليس من الضروري أن نتأخر عن الاختبار.", "يجب أن نتأخر عن الاختبار.", "يمكننا أن نتأخر عن الاختبار.", "يجب ألا نتأخر عن الاختبار."], "a": 3, "why": "must not تفيد المنع، وليست مثل don't have to التي تفيد عدم الضرورة.", "whyEn": "Must not expresses prohibition, unlike don't have to which means not necessary."}, {"id": "int06", "corner": "grammar", "lvl": 1, "q": "There ___ two books on the desk.", "qa": "اختر الإجابة الصحيحة لإكمال الجملة", "opts": ["be", "am", "is", "are"], "a": 3, "why": "نستخدم are مع الجمع (two books).", "whyEn": "We use are with plural nouns (two books)."}, {"id": "int07", "corner": "grammar", "lvl": 1, "q": "My father ___ to work every day.", "qa": "اختر الإجابة الصحيحة لإكمال الجملة", "opts": ["going", "go", "gone", "goes"], "a": 3, "why": "المفرد الغائب في المضارع البسيط يأخذ s أو es.", "whyEn": "Third person singular in present simple takes -s/-es."}, {"id": "int08", "corner": "grammar", "lvl": 2, "q": "Yesterday we ___ to the park.", "qa": "اختر الإجابة الصحيحة لإكمال الجملة", "opts": ["go", "gone", "went", "goed"], "a": 2, "why": "went هو الماضي البسيط غير المنتظم للفعل go.", "whyEn": "Went is the irregular past simple of go."}, {"id": "int09", "corner": "grammar", "lvl": 2, "q": "___ do you live? - In Jubail.", "qa": "اختر أداة الاستفهام المناسبة", "opts": ["What", "When", "Where", "Who"], "a": 2, "why": "الجواب عن مكان، لذلك نسأل بـ Where.", "whyEn": "The answer is a place, so we ask with Where."}, {"id": "int10", "corner": "grammar", "lvl": 3, "q": "This book is ___ than that one.", "qa": "اختر صيغة المقارنة الصحيحة", "opts": ["interestinger", "most interesting", "the most interesting", "more interesting"], "a": 3, "why": "الصفات الطويلة تأخذ more في المقارنة مع than.", "whyEn": "Long adjectives use more + adjective + than."}, {"id": "int11", "corner": "writing", "lvl": 1, "q": "Choose the correct sentence.", "qa": "اختر الجملة الصحيحة", "opts": ["She not like tea.", "She don't like tea.", "She doesn't like tea.", "She doesn't likes tea."], "a": 2, "why": "مع she نستخدم doesn't ثم الفعل المجرد.", "whyEn": "With she we use doesn't followed by the base verb."}, {"id": "int12", "corner": "writing", "lvl": 1, "q": "I was tired, ___ I went to bed early.", "qa": "اختر أداة الربط المناسبة", "opts": ["although", "but", "or", "so"], "a": 3, "why": "so تربط النتيجة بالسبب: كنت متعبًا فنمت مبكرًا.", "whyEn": "So links a result to a cause: I was tired, so I slept early."}, {"id": "int13", "corner": "writing", "lvl": 2, "q": "Choose the correct sentence.", "qa": "اختر الجملة ذات علامات الترقيم الصحيحة", "opts": ["Where is my phone.", "Where is my phone?", "Where is my phone,", "where is my phone?"], "a": 1, "why": "الجملة تبدأ بحرف كبير وتنتهي بعلامة استفهام لأنها سؤال.", "whyEn": "A question starts with a capital letter and ends with a question mark."}, {"id": "int14", "corner": "writing", "lvl": 2, "q": "I like football, ___ I don't like basketball.", "qa": "اختر أداة الربط المناسبة", "opts": ["so", "and", "but", "because"], "a": 2, "why": "but تربط فكرتين متعاكستين.", "whyEn": "But joins two contrasting ideas."}, {"id": "int15", "corner": "writing", "lvl": 3, "q": "Put the sentences in the best order:\n(A) Finally, I leave for school.\n(B) Then I wash my face.\n(C) First, I wake up at six.\n(D) After that, I eat breakfast.", "qa": "اختر الترتيب الصحيح للجمل", "opts": ["C, D, B, A", "B, C, D, A", "C, B, D, A", "C, B, A, D"], "a": 2, "why": "كلمات الترتيب: First ثم Then ثم After that ثم Finally.", "whyEn": "Sequence words go in order: First, Then, After that, Finally."}, {"id": "int16", "corner": "reading", "lvl": 1, "q": "Sara has a small garden. She grows tomatoes and mint. Every morning she waters the plants before school. Her mother uses the mint to make tea.\n\nWhen does Sara water the plants?", "qa": "اقرأ النص ثم أجب عن السؤال", "opts": ["Before school", "On Fridays only", "At night", "After dinner"], "a": 0, "why": "النص يقول: كل صباح قبل المدرسة.", "whyEn": "The text says: every morning before school."}, {"id": "int17", "corner": "reading", "lvl": 1, "q": "Ali's school day starts at 7:00. First he has Arabic, then maths. At 9:30 there is a break for twenty minutes. Ali usually eats a sandwich and plays football.\n\nWhat does Ali do at break?", "qa": "اقرأ النص ثم أجب عن السؤال", "opts": ["He watches television.", "He goes home.", "He studies maths.", "He eats a sandwich and plays football."], "a": 3, "why": "النص يذكر أنه يأكل شطيرة ويلعب كرة القدم في الاستراحة.", "whyEn": "The text says he eats a sandwich and plays football at break."}, {"id": "int18", "corner": "reading", "lvl": 2, "q": "It was cold and windy. Huda put on her coat and took an umbrella. Dark clouds covered the sky.\n\nWhat will the weather probably be like?", "qa": "اقرأ النص ثم أجب عن السؤال", "opts": ["Snowy and bright", "Rainy", "Clear and calm", "Sunny and hot"], "a": 1, "why": "الغيوم الداكنة والمظلة تدلان على أن المطر قادم.", "whyEn": "Dark clouds and an umbrella suggest that rain is coming."}, {"id": "int19", "corner": "reading", "lvl": 2, "q": "The museum is very crowded on weekends. Hundreds of visitors stand in line to buy tickets. On weekdays, however, it is quiet, so many people prefer to visit then.\n\nIn the text, 'crowded' means ___.", "qa": "اقرأ النص ثم أجب عن السؤال", "opts": ["full of people", "closed", "far away", "very old"], "a": 0, "why": "السياق (مئات الزوار في الطابور) يدل على أن crowded تعني مزدحم.", "whyEn": "The context (hundreds of visitors in line) shows crowded means full of people."}, {"id": "int20", "corner": "reading", "lvl": 3, "q": "Many students think that studying all night helps them pass exams. However, scientists say that sleep is important for memory. A student who sleeps well remembers more than a tired student. Because of this, teachers advise students to study a little every day.\n\nWhat is the main idea of the text?", "qa": "اقرأ النص ثم أجب عن السؤال", "opts": ["Teachers do not like exams.", "Students should never study at night.", "Scientists study very little.", "Regular study and good sleep help students more than studying all night."], "a": 3, "why": "النص يوصي بالمذاكرة اليومية والنوم الجيد بدل السهر.", "whyEn": "The text recommends daily study and good sleep instead of staying up all night."}], "secondary": [{"id": "sec01", "corner": "translation", "lvl": 1, "q": "Choose the best Arabic translation:\nHe is looking forward to meeting his cousins.", "qa": "اختر أفضل ترجمة عربية للجملة", "opts": ["يتطلع بشوق إلى لقاء أبناء عمومته.", "كان يلتقي بأبناء عمومته كل يوم.", "يبحث عن أبناء عمومته في كل مكان.", "ينظر إلى أبناء عمومته من بعيد."], "a": 0, "why": "look forward to تعني يتطلع بشوق إلى، وليست معناها الحرفي (ينظر إلى الأمام).", "whyEn": "Look forward to means to await eagerly, not to look ahead literally."}, {"id": "sec02", "corner": "translation", "lvl": 2, "q": "Choose the correct English translation:\nلو كنت مكانك لقبلت العرض.", "qa": "اختر الترجمة الإنجليزية الصحيحة للجملة", "opts": ["If I were you, I accepted the offer.", "If I were you, I would accept the offer.", "If I am you, I would accepted the offer.", "If I were you, I will accept the offer."], "a": 1, "why": "الشرط من النوع الثاني: If + were ثم would + الفعل المجرد.", "whyEn": "Second conditional: If + were, then would + base verb."}, {"id": "sec03", "corner": "translation", "lvl": 2, "q": "Choose the best English translation:\nهطلت أمطار غزيرة أمس.", "qa": "اختر الترجمة الإنجليزية الأكثر طبيعية", "opts": ["There was much rain yesterday.", "There was strong rain yesterday.", "There was big rain yesterday.", "There was heavy rain yesterday."], "a": 3, "why": "التركيب المعتاد هو heavy rain للمطر الغزير.", "whyEn": "The natural collocation is heavy rain."}, {"id": "sec04", "corner": "translation", "lvl": 3, "q": "Choose the best Arabic translation:\nHe is very sensible.", "qa": "اختر أفضل ترجمة عربية للجملة", "opts": ["إنه كثير الكلام.", "إنه شديد الحساسية.", "إنه شخص عاقل ورزين.", "إنه ملموس جدًا."], "a": 2, "why": "sensible تعني عاقل ومتزن، وهي ليست بمعنى حساس (sensitive).", "whyEn": "Sensible means reasonable, not sensitive; this is a false friend."}, {"id": "sec05", "corner": "translation", "lvl": 3, "q": "Choose the best Arabic translation:\nActually, I have never visited that city.", "qa": "اختر أفضل ترجمة عربية للجملة", "opts": ["حاليًا، لم أزر تلك المدينة قط.", "في الماضي كنت أزور تلك المدينة كثيرًا.", "أخيرًا زرت تلك المدينة.", "في الحقيقة، لم أزر تلك المدينة قط."], "a": 3, "why": "actually تعني في الحقيقة وليست حاليًا (currently).", "whyEn": "Actually means in fact, not currently; this is a false friend."}, {"id": "sec06", "corner": "grammar", "lvl": 2, "q": "I ___ in Jubail since 2015, and I still like it.", "qa": "اختر الإجابة الصحيحة لإكمال الجملة", "opts": ["lived", "have lived", "was living", "am living"], "a": 1, "why": "since مع فعل مستمر حتى الآن تتطلب المضارع التام.", "whyEn": "Since with an action continuing to now requires the present perfect."}, {"id": "sec07", "corner": "grammar", "lvl": 2, "q": "If I had more free time, I ___ a new language.", "qa": "اختر الإجابة الصحيحة لإكمال الجملة", "opts": ["would have learned", "learned", "would learn", "will learn"], "a": 2, "why": "الشرط من النوع الثاني (If + past) نتيجته would + الفعل المجرد.", "whyEn": "Second conditional (If + past) takes would + base verb."}, {"id": "sec08", "corner": "grammar", "lvl": 3, "q": "The report ___ by Friday.", "qa": "اختر صيغة المبني للمجهول مع الفعل الناقص", "opts": ["must finish", "must be finish", "must be finished", "must to be finished"], "a": 2, "why": "المبني للمجهول مع الأفعال الناقصة: modal + be + اسم المفعول.", "whyEn": "Passive with modals: modal + be + past participle."}, {"id": "sec09", "corner": "grammar", "lvl": 3, "q": "She asked me, \"Where do you live?\"\nReported speech: She asked me where I ___.", "qa": "اختر الصيغة الصحيحة في الكلام المنقول", "opts": ["live you", "am living", "lived", "do live"], "a": 2, "why": "في الكلام المنقول يرجع الزمن خطوة للخلف ويصبح ترتيب الجملة خبريًا.", "whyEn": "In reported speech the tense shifts back and word order becomes a statement."}, {"id": "sec10", "corner": "grammar", "lvl": 3, "q": "The man ___ car was stolen called the police.", "qa": "اختر اسم الموصول المناسب", "opts": ["whom", "who", "whose", "which"], "a": 2, "why": "whose تدل على الملكية (سيارته).", "whyEn": "Whose shows possession (his car)."}, {"id": "sec11", "corner": "writing", "lvl": 2, "q": "The film was very long. ___, I enjoyed every minute.", "qa": "اختر أداة الربط المناسبة", "opts": ["So", "Because", "However", "Therefore"], "a": 2, "why": "However تعبّر عن التضاد بين جملتين منفصلتين.", "whyEn": "However shows contrast between two separate sentences."}, {"id": "sec12", "corner": "writing", "lvl": 2, "q": "Choose the most natural sentence.", "qa": "اختر الجملة الأكثر صحة وطبيعية", "opts": ["I look forward to hearing from you.", "I look forward to hear from you.", "I am looking forward hear from you.", "I look forward hearing from you."], "a": 0, "why": "بعد look forward to نستخدم الفعل مع ing.", "whyEn": "After look forward to we use the -ing form."}, {"id": "sec13", "corner": "writing", "lvl": 3, "q": "Choose the correctly punctuated sentence.", "qa": "اختر الجملة ذات علامات الترقيم الصحيحة", "opts": ["My sister, who lives in Dammam is, a doctor.", "My sister who lives, in Dammam is a doctor.", "My sister who lives in Dammam, is a doctor.", "My sister, who lives in Dammam, is a doctor."], "a": 3, "why": "الجملة الاعتراضية الوصفية توضع بين فاصلتين.", "whyEn": "A non-defining clause is placed between two commas."}, {"id": "sec14", "corner": "writing", "lvl": 3, "q": "Put the sentences in the best order:\n(1) As a result, many people now prefer to shop online.\n(2) Technology has changed the way we shop.\n(3) Second, customers can compare prices in seconds.\n(4) First, online shops are open twenty-four hours a day.", "qa": "اختر الترتيب الصحيح لفقرة متماسكة", "opts": ["2, 4, 3, 1", "4, 2, 3, 1", "2, 4, 1, 3", "2, 3, 4, 1"], "a": 0, "why": "تبدأ الفقرة بالفكرة العامة، ثم First وSecond، وتنتهي بالنتيجة As a result.", "whyEn": "The paragraph starts with the main idea, then First and Second, and ends with As a result."}, {"id": "sec15", "corner": "writing", "lvl": 3, "q": "Which sentence is most suitable to begin a formal job application email?", "qa": "اختر الجملة الأنسب لرسالة رسمية", "opts": ["I am writing to apply for the position of assistant advertised on your website.", "Give me the job please, I am very good.", "I write for want job in your company.", "Hey! I saw your job ad and I want it."], "a": 0, "why": "الرسالة الرسمية تحتاج أسلوبًا مهذبًا وتركيبًا سليمًا.", "whyEn": "A formal email needs a polite tone and correct structure."}, {"id": "sec16", "corner": "reading", "lvl": 2, "q": "Water is very precious in desert countries. Many countries in the Gulf region take sea water and remove the salt from it to make drinking water. This process is called desalination. It needs a lot of energy, so it is expensive. Engineers are now looking for cheaper ways to do it, such as using solar power. Meanwhile, people are encouraged to save water at home by turning off taps and fixing leaks.\n\nAccording to the passage, why is desalination expensive?", "qa": "اقرأ النص ثم أجب عن السؤال", "opts": ["It needs a lot of rain.", "The sea is very far away.", "It uses only solar power.", "It needs a lot of energy."], "a": 3, "why": "النص يقول: it needs a lot of energy, so it is expensive.", "whyEn": "The text says it needs a lot of energy, so it is expensive."}, {"id": "sec17", "corner": "reading", "lvl": 2, "q": "Omar used to spend his evenings on the sofa watching television. Last month, he decided to take up running to improve his health. At first, he could hardly run for five minutes without stopping. However, he did not give up. He ran a little further every week, and now he can run for half an hour. His friends are impressed by his progress, and several of them have joined him.\n\nIn the passage, 'take up' means ___.", "qa": "اقرأ النص ثم أجب عن السؤال", "opts": ["lift from the floor", "spend time on", "start doing as a new activity", "stop doing"], "a": 2, "why": "السياق يبيّن أنه بدأ الجري كنشاط جديد.", "whyEn": "The context shows he began running as a new activity."}, {"id": "sec18", "corner": "reading", "lvl": 3, "q": "Many people believe that working from home is always more relaxing. Yet research shows a more complicated picture. Employees who work at home often feel they must answer messages at any hour, so their working day never really ends. Others miss the casual conversations that happen in an office, and report feeling lonely. On the other hand, they save time and money because they do not need to travel. Experts suggest a mixed model, with some days at home and some in the office.\n\nWhat can we infer from the passage?", "qa": "اقرأ النص ثم أجب عن السؤال", "opts": ["Working from home is bad for everyone.", "People at home always work fewer hours.", "A mix of home and office work may balance the advantages and disadvantages.", "Offices will soon disappear."], "a": 2, "why": "النص يعرض مزايا وعيوبًا للطرفين ويقترح نموذجًا مختلطًا.", "whyEn": "The text presents pros and cons of both and suggests a mixed model."}, {"id": "sec19", "corner": "reading", "lvl": 3, "q": "The council announced plans to close the old library and replace it with a car park. Many residents were reluctant to accept the decision. They argued that the library was not only a place for books but also a meeting point for elderly people and children. A petition against the plan gathered five thousand signatures in one week. The council has now promised to hold a public meeting before making a final decision.\n\nWhy did the residents oppose the plan?", "qa": "اقرأ النص ثم أجب عن السؤال", "opts": ["They believed the library had an important social role as well as offering books.", "They wanted a bigger car park.", "They thought the library was too new.", "They did not like reading books."], "a": 0, "why": "النص يذكر أن المكتبة مكان لقاء لكبار السن والأطفال إلى جانب الكتب.", "whyEn": "The text says the library is also a meeting point for elderly people and children."}, {"id": "sec20", "corner": "reading", "lvl": 3, "q": "Although electric cars are becoming more popular, they are not yet the perfect solution. They produce no exhaust fumes, which makes city air cleaner. However, the batteries need to be charged for hours, and charging stations are still rare in many areas. In addition, producing the batteries uses large amounts of energy and raw materials. Therefore, some experts argue that we should also improve public transport rather than depend only on new cars.\n\nWhat is the writer's main point?", "qa": "اقرأ النص ثم أجب عن السؤال", "opts": ["Electric cars are worse than petrol cars.", "Charging stations are available everywhere.", "Public transport is too expensive.", "Electric cars have benefits but also limits, so other solutions are needed too."], "a": 3, "why": "الكاتب يذكر مزايا وعيوبًا ويدعو إلى حلول أخرى مثل النقل العام.", "whyEn": "The writer lists benefits and drawbacks and calls for other solutions like public transport."}]};

 if(q){const fs=CATALOG.filter(f=>tierOk(f)&&(f.ar+' '+f.en).toLowerCase().includes(q));h=`<h2 class="h2">${N(fs.length)} ${t('files')}</h2>`+(fs.length?`<div class="books">${fs.map(bookCard).join('')}</div>`:`<div class="card lock"><p style="text-align:center;font-weight:800;padding:12px">${t('nores')}</p></div>`);return h}
 h=`<div class="grid secs">`+ST.map((s,i)=>{const n=s.lock?0:stageFiles(s.id).filter(tierOk).length;
  return `<${s.lock?'div':'a'} class="tile sec ${s.lock?'empty':''}" ${orbSt(s)} ${s.lock?'':`href="#/s/${s.id}"`}>${s.lock?`<span class="rib">${t('soon')}</span>`:''}<div class="n">${t('sec')} ${N(i+1)}</div>${orb(s)}<h3>${nm(s)}<small>${L==='ar'?s.en:s.ar}</small></h3><p class="sd">${s.lock?t('lockd'):(L==='ar'?s.da:s.de)}</p><span class="cnt">${s.lock?'':N(n)+' '+t('files')}</span></${s.lock?'div':'a'}>`}).join('')+'</div>';return h}
function stagePage(id){const s=stage(id);if(!s)return home();
 const all=stageFiles(id);const r=store.g('r.'+id,null);
 let h=`<div class="crumb"><a href="#/">${t('home')}</a> › <span>${nm(s)}</span></div><div class="sh">${orb(s)}<div><h1>${nm(s)}<small>${L==='ar'?s.en:s.ar}</small></h1><p>${L==='ar'?s.da:s.de}</p></div></div>`;
  h+=`<div class="test"><span class="ic">🎯</span><div><h3>${t('test')}</h3><p>${t('testd')}${r?` · ${t('last')}: ${N(r.pct)}%`:''}</p></div><a class="btn" href="#/test/${id}">${r?t('again'):t('begin')}</a></div>`;
 h+=`<h2 style="font-weight:900;color:var(--em2);margin:6px 0 12px">${t('corners')}</h2><div class="grid">`;
 s.c.forEach(c=>{const n=files(id,c[0]).length;h+=`<a class="tile ${n?'':'empty'}" ${orbSt(s)} href="#/s/${id}/${c[0]}">${orb(s,1).replace(s.e,c[1])}<h3>${L==='ar'?c[2]:c[3]}<small>${L==='ar'?c[3]:c[2]}</small></h3><span class="cnt">${n?N(n)+' '+t('files'):t('soon')}</span></a>`});
 return h+'</div>'}
function waMsg(f){return L==='ar'?`السلام عليكم، أرغب بطلب الملف المدفوع: ${f.ar} (${N(f.price)} ريال). أرجو إرسال تفاصيل التحويل البنكي.`:`Hello, I would like to order the paid file: ${f.en} (${f.price} SAR). Please send the bank transfer details.`}
function order(id){const f=CATALOG.find(x=>x.id===id);const m=waMsg(f);if(WA_NUMBER){window.open('https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(m),'_blank')}else{try{navigator.clipboard.writeText(m)}catch(e){}toast(t('copiedmsg'));setTimeout(()=>window.open(WA_GROUP,'_blank'),900)}}
function bookCard(f){const paid=f.tier==='paid';return `<article class="bk"><div class="cov"><span class="tr ${paid?'p':'f'}">${paid?'💎 '+price(f):'✨ '+t('free')}</span><img src="${LOGO_BIG}" alt=""><b>${esc(f.en)}</b><i>${esc(f.ar)}</i></div><div class="in"><h4>${esc(L==='ar'?f.ar:f.en)}</h4><div class="meta">${N(f.pages)} ${t('pages')} · PDF</div><div class="act">${paid?`<button class="btn ghost" data-v="${f.id}" data-s="1">👁 ${t('sample')}</button><button class="btn gold" data-o="${f.id}">🛒 ${t('order')}</button>`:`<button class="btn ghost" data-v="${f.id}">👁 ${t('view')}</button><a class="btn gold" href="pdf/${f.id}.pdf" download="Anglomania - ${esc(f.en)}.pdf">⬇ ${t('dl')}</a>`}</div></div></article>`}
function cornerPage(id,cid){const s=stage(id);const c=s&&s.c.find(x=>x[0]===cid);if(!c)return home();const fs=files(id,cid).filter(tierOk);
 let h=`<div class="crumb"><a href="#/">${t('home')}</a> › <a href="#/s/${id}">${nm(s)}</a> › <span>${L==='ar'?c[2]:c[3]}</span></div><div class="sh">${orb(s).replace(s.e,c[1])}<div><h1>${L==='ar'?c[2]:c[3]}<small>${L==='ar'?c[3]:c[2]}</small></h1><p>${N(fs.length)} ${t('files')}</p></div></div>`;
 h+=fs.length?`<div class="books">${fs.map(bookCard).join('')}</div>`:`<div class="card lock"><span class="rib">${t('soon')}</span><p style="font-size:16px;font-weight:800;text-align:center;padding:14px">${t('noitems')}</p></div>`;
 return h+`<div class="cta" style="margin-top:22px"><a class="btn gold" href="#/test/${id}">🎯 ${t('test')}</a><a class="btn ghost" href="#/s/${id}">${t('back')}</a></div>`}
/* quiz */
let Q=null;
function testPage(id){const s=stage(id);const bank=(PLACEMENT||{})[id];if(!s||!bank||!bank.length)return `<div class="card lock" style="margin-top:20px"><span class="rib">${t('soon')}</span><p style="text-align:center;font-weight:800;padding:12px">${t('noitems')}</p></div>`;
 const items=bank.map(q=>{const idx=q.opts.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[idx[i],idx[j]]=[idx[j],idx[i]]}return {q,idx}});
 const order=items.map((x,i)=>i).sort((a,b)=>items[a].q.lvl-items[b].q.lvl||Math.random()-.5);
 Q={id,items:order.map(i=>items[i]),i:0,ans:[],done:false};
 return `<div class="crumb"><a href="#/">${t('home')}</a> › <a href="#/s/${id}">${nm(s)}</a> › <span>${t('test')}</span></div><div class="qz" id="qz"></div>`}
function renderQ(){const z=$('#qz');if(!z||!Q)return;const s=stage(Q.id);if(Q.i>=Q.items.length)return renderRes();
 const {q,idx}=Q.items[Q.i];const pct=Q.i/Q.items.length*100;
 z.innerHTML=`<div class="qbar"><div class="trk"><i style="width:${pct}%"></i></div><span>${Q.i+1}/${Q.items.length}</span></div>
 <div class="qc"><span class="cn">${esc(L==='ar'?CN[q.corner][0]:CN[q.corner][1])}</span>
 ${q.say?`<div><button class="say" id="sayb">🔊 ${t('hear')}</button></div>`:''}
 <div class="q" dir="auto">${esc(q.q)}</div>${L==='ar'&&q.qa?`<div class="qa">${esc(q.qa)}</div>`:''}
 <div class="opts">${idx.map((oi,k)=>`<button class="op" data-o="${oi}" data-l="${'ABCD'[k]}" dir="auto"><span>${esc(q.opts[oi])}</span></button>`).join('')}</div>
 <div class="fb" id="fb"></div><div class="nx" id="nx"><button class="btn" id="nxb">${Q.i+1===Q.items.length?t('finish'):t('next')} ${L==='ar'?'←':'→'}</button></div></div>`;
 if(q.say){const b=$('#sayb');b.onclick=()=>speak(q.say);setTimeout(()=>speak(q.say),350)}
 z.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const o=+b.dataset.o,ok=o===q.a;Q.ans.push({id:q.id,corner:q.corner,ok});
  z.querySelectorAll('.op').forEach(x=>{x.disabled=true;if(+x.dataset.o===q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');beep(ok);
  const fb=$('#fb');fb.className='fb on '+(ok?'ok':'no');fb.innerHTML=(ok?'✅ '+t('correct'):'💡 '+t('wrong'))+(q.why?' — '+esc(L==='ar'?q.why:(q.whyEn||q.why)):'');$('#nx').classList.add('on');$('#nxb').onclick=()=>{Q.i++;renderQ();scrollTo({top:0,behavior:'smooth'})};$('#nxb').focus()})}
function renderRes(){const z=$('#qz');const s=stage(Q.id);const tot=Q.ans.length,ok=Q.ans.filter(a=>a.ok).length,pct=Math.round(ok/tot*100);
 const by={};Q.ans.forEach(a=>{by[a.corner]=by[a.corner]||[0,0];by[a.corner][1]++;if(a.ok)by[a.corner][0]++});
 const cs=Object.keys(by).map(k=>({k,p:Math.round(by[k][0]/by[k][1]*100)}));const weak=cs.slice().sort((a,b)=>a.p-b.p)[0];
 const lv=pct>=75?3:pct>=40?2:1;store.s('r.'+Q.id,{pct,ts:Date.now(),by:cs});
 const stages=ST.filter(x=>!x.lock);const si=stages.findIndex(x=>x.id===Q.id);
 const rf=files(Q.id,weak.k).slice(0,3);
 const nextS=lv===3&&stages[si+1],prevS=pct<30&&si>0&&stages[si-1];
 z.innerHTML=`<div class="qc res"><div style="font-size:54px">${['','🌱','🌿','🌳'][lv]}</div><div class="lv">${t('lv'+lv)}</div>
 <div class="ring" id="rg"><b>${N(0)}%</b></div><p style="font-weight:700;color:var(--muted)">${t('lv'+lv+'d')}</p>
 <h4 style="margin-top:16px;font-weight:900;color:var(--em2)">${t('byc')}</h4><div class="bars">${cs.map(c=>`<div class="bar"><span>${L==='ar'?CN[c.k][0]:CN[c.k][1]}</span><div class="t ${c.p<50?'w':''}"><i data-w="${c.p}"></i></div><b dir="ltr">${c.p}%</b></div>`).join('')}</div>
 <div class="rec"><h4>🧭 ${t('rec')}: ${L==='ar'?CN[weak.k][0]:CN[weak.k][1]}</h4>${rf.length?rf.map(f=>`<a href="#/s/${Q.id}/${weak.k}">📘 ${esc(L==='ar'?f.ar:f.en)}</a>`).join(''):`<a href="#/s/${Q.id}">${t('noitems')}</a>`}</div>
 <div class="cta"><a class="btn" href="#/s/${Q.id}">📚 ${t('cont')}</a><button class="btn gold" id="cp">📋 ${t('copy')}</button><a class="btn ghost" href="#/test/${Q.id}">↻ ${t('again')}</a>${nextS?`<a class="btn ghost" href="#/test/${nextS.id}">⬆ ${t('upstage')}</a>`:''}${prevS?`<a class="btn ghost" href="#/test/${prevS.id}">⬇ ${t('downstage')}</a>`:''}</div></div>`;
 let v=0;const rg=$('#rg');const iv=setInterval(()=>{v=Math.min(pct,v+Math.ceil(pct/30)+1);rg.style.setProperty('--v',v);rg.firstChild.textContent=N(v)+'%';if(v>=pct)clearInterval(iv)},30);
 setTimeout(()=>z.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%'),60);if(lv>1){confetti();beep(true)}
 $('#cp').onclick=()=>{const tx=`Anglomania · ${nm(s)}\n${t('score')}: ${pct}% (${t('lv'+lv)})\n`+cs.map(c=>`${L==='ar'?CN[c.k][0]:CN[c.k][1]}: ${c.p}%`).join('\n')+'\nanglomaniaedu.com';(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(()=>toast(t('copied')),()=>toast(tx))}}
/* router */
function route(){const mm=$('#mod');if(mm&&mm.classList.contains('on')){mm.classList.remove('on');$('#mf').src='about:blank'}const h=location.hash.replace(/^#\/?/,'').split('/');const app=$('#app');speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();let v;
 if(h[0]==='s'&&h[1]&&h[2])v=cornerPage(h[1],h[2]);else if(h[0]==='s'&&h[1])v=stagePage(h[1]);else if(h[0]==='test'&&h[1])v=testPage(h[1]);else v=home();
 app.innerHTML=v;document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';$('#lang').textContent=L==='ar'?'EN':'عربي';$('#snd').textContent=SND?'🔊':'🔇';document.title=(L==='ar'?'ركن التأسيس':'Foundation Corner')+' · Anglomania';
 if(h[0]==='test')renderQ();
 bindFiles();
 if($('#hres')){$('#hres').innerHTML=homeRes();bindFiles();$('#sq').oninput=e=>{FQ=e.target.value;$('#hres').innerHTML=homeRes();bindFiles()};document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{FT=b.dataset.tf;route()})}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});app.querySelectorAll('.st').forEach(e=>io.observe(e));
 if(!h[0]||h[0]==='')scrollTo(0,0);else scrollTo({top:0})}
function bindFiles(){document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>openPdf(b.dataset.v,b.dataset.s));document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>order(b.dataset.o))}
function openPdf(id,smp){const f=CATALOG.find(x=>x.id===id);if(!f)return;const u=(smp?'pdf/samples/':'pdf/')+id+'.pdf';
 if(matchMedia('(pointer:coarse)').matches||innerWidth<700){window.open(u,'_blank');return}
 $('#mt').textContent=L==='ar'?f.ar:f.en;const d=$('#md');d.style.display=smp?'none':'';d.href=u;d.setAttribute('download','Anglomania - '+f.en+'.pdf');d.textContent='⬇ '+t('dl');$('#mf').src=u+'#view=FitH';$('#mod').classList.add('on')}
$('#mc').onclick=()=>{$('#mod').classList.remove('on');$('#mf').src='about:blank'};$('#mod').onclick=e=>{if(e.target.id==='mod')$('#mc').onclick()};addEventListener('keydown',e=>{if(e.key==='Escape')$('#mc').onclick()});
$('#lang').onclick=()=>{L=L==='ar'?'en':'ar';try{localStorage.setItem('angfc.lang',L)}catch(e){}route()};
$('#snd').onclick=()=>{SND=!SND;try{localStorage.setItem('angfc.snd',SND?'1':'0')}catch(e){}$('#snd').textContent=SND?'🔊':'🔇';toast(SND?t('sndon'):t('sndoff'))};
addEventListener('scroll',()=>{const p=$('#path'),f=$('#fill');if(!p||!f)return;const r=p.getBoundingClientRect();const v=Math.max(0,Math.min(1,(innerHeight*.6-r.top)/r.height));f.style.setProperty('--p',v*100+'%')},{passive:true});
addEventListener('hashchange',route);route();
</script>
