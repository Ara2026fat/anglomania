<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E5E3E"><title>مكتبة ركن التأسيس · Anglomania</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--c:#0E5E3E;--b:#DDF3E6;--gold:#D4A72C;--goldD:#9E7E22;--em:#0E5E3E}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Cairo,"Segoe UI",Tahoma,sans-serif;background:linear-gradient(180deg,#FFFFFA,#FBF7EA 55%,#F8F0CF);color:#17302A;min-height:100vh;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(254,253,245,.94);backdrop-filter:blur(10px);border-bottom:3px solid var(--gold)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;max-width:1200px;margin:auto}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:99px;background:#fff;border:3px solid #eadfb8;font-weight:900;font-size:20px;color:#17302A;transition:.15s}
.tab .e{font-size:26px}.tab.on{background:var(--tc);border-color:var(--tc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);transform:translateY(-2px)}
.page{display:none;max-width:1200px;margin:auto;padding:22px 16px 130px;animation:in .35s}.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.cover{text-align:center}.cover img{width:min(300px,70vw)}.cover h1{font-size:clamp(44px,10vw,84px);font-weight:900;color:var(--em);line-height:1.15}.cover h1 em{font-style:normal;color:var(--gold)}
.cover p{font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--goldD);margin-top:6px}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:30px}
.sc{border-radius:30px;padding:26px 20px;color:#fff;background:linear-gradient(160deg,var(--tc),var(--td));box-shadow:0 8px 0 var(--td);text-align:center;transition:.15s}.sc:active{transform:translateY(4px);box-shadow:0 4px 0 var(--td)}
.sc .e{font-size:64px;display:block}.sc b{display:block;font-size:34px;font-weight:900;line-height:1.25;margin-top:4px}.sc span{display:block;font-size:22px;font-weight:800;opacity:.95;margin-top:6px}
.ph{display:flex;align-items:center;gap:16px;background:linear-gradient(160deg,var(--tc),var(--td));color:#fff;border-radius:30px;padding:20px 26px;box-shadow:0 8px 0 var(--td);margin-bottom:22px}
.ph .e{font-size:64px}.ph h2{font-size:clamp(34px,7vw,52px);font-weight:900;line-height:1.15}.ph small{display:block;font-size:22px;font-weight:800;opacity:.92;direction:ltr;text-align:start}
.ph .cnt{margin-inline-start:auto;background:#fff;color:var(--tc);border-radius:20px;padding:6px 20px;font-size:26px;font-weight:900;text-align:center;line-height:1.2}
.list{display:grid;grid-template-columns:1fr;gap:16px}@media(min-width:900px){.list{grid-template-columns:1fr 1fr}}
.f{display:flex;align-items:center;gap:16px;background:#fff;border:4px solid var(--tc);border-radius:26px;padding:16px 18px;box-shadow:0 6px 0 var(--tc);position:relative}
.f:nth-child(odd){background:var(--tb)}
.n{flex:none;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 32% 28%,var(--tl),var(--tc));color:#fff;font-weight:900;font-size:34px;display:grid;place-items:center;box-shadow:inset 0 -6px 8px rgba(0,0,0,.2),inset 0 4px 5px rgba(255,255,255,.4)}
.t b{display:block;font-size:clamp(26px,5.4vw,34px);font-weight:900;line-height:1.35;color:#102a22}.t i{display:block;font-style:normal;font-weight:800;font-size:clamp(19px,4vw,23px);color:#7a5f10;direction:ltr;text-align:start;margin-top:2px}
.pg{margin-inline-start:auto;flex:none;text-align:center;font-weight:900;color:var(--tc);font-size:30px;line-height:1}.pg small{display:block;font-size:16px;color:#5B6C65;margin-top:3px}
.nav{position:fixed;bottom:0;inset-inline:0;z-index:30;background:rgba(254,253,245,.96);backdrop-filter:blur(10px);border-top:3px solid var(--gold);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:1200px;margin:auto;display:flex;align-items:center;gap:10px}
.nb{padding:14px 18px;border-radius:18px;font-size:22px;font-weight:900;background:linear-gradient(180deg,#1FA571,var(--em));color:#FFF3C8;border:3px solid var(--goldD);box-shadow:0 5px 0 #0A4530}.nb:active{transform:translateY(3px);box-shadow:0 2px 0 #0A4530}.nb[disabled]{opacity:.35;pointer-events:none}
.dots{flex:1;display:flex;justify-content:center;gap:5px}.dots button{width:11px;height:11px;border-radius:50%;background:#e4d9a8}.dots button.on{background:var(--gold);width:24px;border-radius:7px}
.ft{text-align:center;color:var(--goldD);font-weight:800;font-size:18px;margin-top:26px}
</style></head><body>

const css=s=>`--tc:${s.c};--td:${s.d};--tl:${s.l};--tb:${s.b}`;
const P=[{t:'home'}];let num=0;
S.forEach(s=>{const a=D[s.id];const per=a.length>8?Math.ceil(a.length/2):a.length;for(let i=0;i<a.length;i+=per)P.push({t:'st',s,items:a.slice(i,i+per),start:i,part:i?2:1,multi:a.length>per})});
let cur=0;
function tabs(){document.getElementById('tabs').innerHTML=`<button class="tab ${cur===0?'on':''}" style="--tc:#0E5E3E" data-go="0"><span class="e">🏠</span>الرئيسية</button>`+S.map(s=>{const i=P.findIndex(p=>p.s===s);return `<button class="tab ${P[cur].s===s?'on':''}" style="--tc:${s.c}" data-go="${i}"><span class="e">${s.e}</span>${s.ar}</button>`}).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go))}
function view(){const p=P[cur];const m=document.getElementById('m');
 if(p.t==='home'){m.innerHTML=`<section class="page on cover"><img src="${LOGO}" alt="Anglomania"><h1>مكتبة <em>ركن التأسيس</em></h1><p>${N(S.reduce((a,s)=>a+D[s.id].length,0))} ملف PDF · أربع مراحل</p><div class="stg">${S.map(s=>`<button class="sc" style="${css(s)}" data-go="${P.findIndex(x=>x.s===s)}"><span class="e">${s.e}</span><b>${s.ar}</b><span>${s.en}</span><span style="font-size:30px;font-weight:900">${N(D[s.id].length)} ملفاً</span></button>`).join('')}</div><div class="ft">ARAFAT ALRAJHI © 2026 · Anglomania · More Than English</div></section>`}
 else{const s=p.s;let n=0;S.forEach(x=>{if(x===s)return;});const base=S.slice(0,S.indexOf(s)).reduce((a,x)=>a+D[x.id].length,0)+p.start;
  m.innerHTML=`<section class="page on" style="${css(s)}"><div class="ph"><span class="e">${s.e}</span><div><h2>${s.ar}${p.multi?` <span style="font-size:.55em;opacity:.9">(${N(p.part)}/٢)</span>`:''}</h2><small>${s.en}</small></div><div class="cnt">${N(D[s.id].length)}<br><span style="font-size:16px">ملفاً</span></div></div><div class="list">${p.items.map((f,i)=>`<div class="f"><div class="n">${N(base+i+1)}</div><div class="t"><b>${f.ar}</b><i>${f.en}</i></div><div class="pg">${N(f.p)}<small>صفحة</small></div></div>`).join('')}</div></section>`}
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
 document.getElementById('dots').innerHTML=P.map((_,i)=>`<button class="${i===cur?'on':''}" data-go="${i}" aria-label="${i+1}"></button>`).join('');document.querySelectorAll('#dots [data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
 document.getElementById('pv').disabled=cur===0;document.getElementById('nx').disabled=cur===P.length-1;tabs()}
function go(i){cur=Math.max(0,Math.min(P.length-1,i));view();scrollTo({top:0})}
pv.onclick=()=>go(cur-1);nx.onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur+1);if(e.key==='ArrowRight')go(cur-1)});
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(d)>90)go(d<0?cur+1:cur-1)},{passive:true});
view();
</script></body></html>
