function card(r){return `<div class="c${r.ok?' ok':r.chg?' w':''}" data-id="${r.id}"><div class="t"><span class="n">${N(r.n)}</span><span class="b ${r.tier==='paid'?'p':'f'}">${r.tier==='paid'?'مدفوع':'مجاني'}</span>${N(r.pages)} صفحة · <a href="https://anglomaniaedu.com/pdf/${r.id}.pdf" target="_blank">افتح الكتاب</a>${r.chg?' · <b style="color:#9a6a00">اسم إنجليزي مقترح</b>':''}</div>

function draw(){document.getElementById('g').innerHTML=D.map(card).join('');stat()}
